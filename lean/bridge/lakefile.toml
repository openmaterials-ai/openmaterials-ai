name = "omai_physlib_bridge"
defaultTargets = ["OMAIPhyslibBridge"]

[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "8ddcc004043c5b537e4225fa763121c176b62a4a"

[[lean_lib]]
name = "OMAIPhyslibBridge"
globs = ["OMAIPhyslibBridge", "OMAIPhyslibDimensions", "OMAIPhyslibSemantics", "OMAIPhyslibContinuum", "OMAIPhyslibHarmonicEnsemble", "OMAIPhyslibHarmonicSums", "OMAIPhyslibHarmonicProduct", "OMAIPhyslibHarmonicDensity", "OMAIPhyslibJointDensity"]
