# Deploys the site Worker (infra/site) after ci passes on main. The Worker bundles docs/ as its static
# fallback, so every merge changes it, not only edits under infra/site. The token is an API token of the
# Cloudflare account that holds openmaterials.ai (Edit Cloudflare Workers, zone openmaterials.ai).
# workflow_dispatch deploys again, or rolls back to, a chosen commit on main, for example after
# a missing owner line was posted.
name: deploy-site

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # A workflow_run's github.sha is the main tip when ci finished. A ci run that main
    # had already moved past is skipped here, so every run of this job checks out the
    # commit GitHub records as its head_sha, which the owner-agreement step reads back
    # to find the last commit it judged. A re-run keeps its first attempt's github.sha,
    # so it is skipped too: retry with a dispatch on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha &&
      github.run_attempt == 1)
    # Checkout, and the owner-agreement step's reads of pull requests, their
    # comments and this workflow's earlier runs.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    # The Cloudflare token is to move into this environment, with deployment branches
    # limited to main, so a workflow on another branch cannot read it. GitHub creates
    # the environment on first use with no branch rule. Until IT and security sets the
    # rule and moves the secret, the job reads the repository secret as before.
    environment: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5219ec03b38a883ca6919581402272fd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # Main as it is now: it may have moved while this job queued. A ci deploy ships only
      # the tip, a dispatch any commit on main.
      - id: tip
        run: |
          git fetch -q origin main
          head=$(git rev-parse HEAD)
          tip=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor "$head" "$tip"; then
            echo "::error::deploy-site: $head is not on main; nothing shipped"
            exit 1
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$head" != "$tip" ]; then
            echo "::notice::deploy-site: skipped, $head is no longer the main tip ($tip); only the tip ships"
          else
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi
      # Part 9 of the working agreement between seats: every main commit this deploy
      # ships, since the last one this step passed, carries the lines of its owning
      # seats (OWNERS.md), on its pull request or on the commit, or is a pure revert.
      # It refuses before anything ships.
      - if: steps.tip.outputs.ship == 'true'
        name: owner-agreement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/owner_agreement.py --deployed HEAD --workflow deploy-site.yml
      - if: steps.tip.outputs.ship == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/site/package-lock.json
      - if: steps.tip.outputs.ship == 'true'
        name: Install
        working-directory: infra/site
        run: npm ci
      - if: steps.tip.outputs.ship == 'true'
        name: Deploy
        working-directory: infra/site
        run: npx wrangler deploy
      - if: steps.tip.outputs.ship == 'true'
        name: Check
        run: curl -fsS https://openmaterials.ai/healthz
