# Test gate: a fresh clone must install and pass the suite. API-key-gated
# tests (the live golden parser run) skip themselves when no key is present,
# so this stays green without secrets. Lint (ruff) is not wired yet: the
# configured rules currently report existing violations repo-wide; add a
# `ruff check .` step once that cleanup lands.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # The distance layer needs its optional extras; without them tests/distance
  # skips itself, so the base matrix above stays lean.
  distance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,distance,amd]"
      - name: Test
        run: pytest tests/distance -q

  # An installed package has no docs/data/: it resolves uids against the
  # registry the wheel ships. Build the wheel, install it into a fresh venv and
  # run the check from outside the checkout, so nothing imports the source tree.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and install the wheel
        run: |
          pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Validate records pinning the Si uid and its alias
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_wheel.py"'

  # Configuration uids hash an spglib-standardized cell; the canonical-JSON
  # vector runs on both architectures, so a platform-dependent byte fails here.
  configurations:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "pymatgen>=2024.1.1"
      - name: Test
        run: pytest tests/test_configurations.py -q
