<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-code agreement | OpenMaterials</title>
<meta name="description" content="Each group holds values for the same observable, material, and conditions that differ only in method or code, with the group's spread.">
<link rel="canonical" href="https://openmaterials.ai/agreement/">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="openmaterials.ai">
<meta property="og:title" content="Cross-code agreement | OpenMaterials">
<meta property="og:description" content="Each group holds values for the same observable, material, and conditions that differ only in method or code, with the group's spread.">
<meta property="og:url" content="https://openmaterials.ai/agreement/">
<meta property="og:image" content="https://openmaterials.ai/assets/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The openmaterials.ai mark and wordmark above the line A versioned map of physics, with the licenses: map data CC BY 4.0, code Apache 2.0.">
<meta name="twitter:card" content="summary_large_image">
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
<link rel="preload" href="../assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/site.css">
<style>
  /* one block per agreement group (spec 4.2) */
  .grp { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
  .grp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .grp-head .obs, .grp-head .sym, .grp-head .spread { font: 400 16px/24px var(--font-mono); overflow-wrap: anywhere; }
  .grp-head .sym { color: var(--ink-2); }
  .grp-head .spread { margin-left: auto; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .cond { margin: 12px 0 16px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
  .cond .mono { color: var(--ink); overflow-wrap: anywhere; }
  td.val, td.est, td.code { font-family: var(--font-mono); font-size: 13px; }
  td.val { white-space: nowrap; }
  td .u { color: var(--ink-2); }
  .pin { margin-top: 48px; }
  .pin .mono { font-size: 13px; overflow-wrap: anywhere; }
  .empty { color: var(--ink-2); }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-site-header></div>
<main class="frame" id="main">
  <noscript><div class="page-body"><p class="empty">This page renders the agreement layer client-side and needs JavaScript.
    The raw groups are plain JSON in <a href="../data/agreement.json">../data/agreement.json</a>.</p></div></noscript>
</main>
<script>
'use strict';
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fail(msg){
  document.getElementById('main').innerHTML =
    '<div class="page-body"><p id="err" class="notice notice--error">' + esc(msg) + '</p></div>';
}
function condText(c){
  if (!c || typeof c !== 'object') return '';
  return Object.keys(c).map(function(k){ return k + ' = ' + c[k]; }).join('  ·  ');
}
function pct(x){ return (Number(x) * 100).toFixed(1) + '%'; }

var DATA = null;   // { summary, groups, catalog }
function load(){
  return Promise.all([
    fetch('../data/agreement.json').then(function(r){ return r.json(); }),
    fetch('../data/catalog.json').then(function(r){ return r.json(); })
  ]).then(function(parts){
    var agreement = parts[0], catalog = {};
    parts[1].forEach(function(n){ catalog[n.id] = n; });
    DATA = {
      summary: agreement.summary || {},
      groups: agreement.groups || [],
      catalog: catalog
    };
  });
}

function pinHtml(){
  var v = (DATA.summary && DATA.summary.version) || '';
  return '<p class="notice pin">Map version <span class="mono">' + esc(v.slice(0, 12)) + '</span>' +
    (v ? ' (<span class="mono">' + esc(v) + '</span>)' : '') +
    '. The groups are derived from the values committed in the current site build. Cite the map version with any spread you share.' +
    '<br>Contributors grant the initiative a non-exclusive license to redistribute each value under CC BY 4.0 and keep every other right. Raw artifacts are never ingested, and reuse credits the source named in each value\'s provenance ' +
    '(<a href="https://github.com/openmaterials-ai/openmaterials-ai/blob/main/GOVERNANCE.md">GOVERNANCE.md, "Data ownership and fairness"</a>).</p>';
}

function badgesHtml(g){
  var out = '';
  if (g.has_cross_code)
    out += '<span class="pill cross" title="The same method computed by different codes on the same inputs">cross-code</span>';
  if (g.has_measurement)
    out += '<span class="pill exp" title="A measurement and a simulation of the same quantity under the same conditions">theory vs experiment</span>';
  return out ? '<div class="badges">' + out + '</div>' : '';
}

function groupHtml(g){
  var node = (DATA.catalog[g.observable]) || {};
  var sym = node.symbol ? '<span class="sym">' + esc(node.symbol) + '</span>' : '';
  var rows = (g.members || []).map(function(m){
    return '<tr>' +
      '<td class="val">' + esc(m.value) +
        (m.units ? ' <span class="u">' + esc(m.units) + '</span>' : '') + '</td>' +
      '<td class="est">' + esc(m.estimator) + '</td>' +
      '<td class="code">' + esc(m.ref) + '</td>' +
      '<td class="kind"><span class="pill kind-' + esc(m.kind) + '">' + esc(m.kind) + '</span></td>' +
      '</tr>';
  }).join('');
  return '<section class="grp">' +
    '<div class="grp-head">' +
      '<span class="obs">' + esc(g.observable) + '</span>' + sym +
      '<span class="mat">' + esc(g.material) + '</span>' +
      '<span class="spread">spread ' + esc(pct(g.spread)) + '</span>' +
    '</div>' +
    badgesHtml(g) +
    '<p class="cond">Conditions <span class="mono">' + esc(condText(g.conditions)) + '</span></p>' +
    '<div class="table-wrap"><table class="table"><thead><tr>' +
      '<th>Value</th><th>Estimator</th><th>Code</th><th>Kind</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</section>';
}

function render(){
  document.title = 'Cross-code agreement | OpenMaterials';
  var s = DATA.summary || {};
  var groups = DATA.groups || [];
  var summary =
    '<dl class="ledger">' +
    '<div><dt>Groups</dt><dd class="mono">' + esc(s.groups || 0) + '</dd></div>' +
    '<div><dt>Cross-code</dt><dd class="mono">' + esc(s.cross_code || 0) + '</dd></div>' +
    '<div><dt>Theory vs experiment</dt><dd class="mono">' + esc(s.theory_vs_experiment || 0) + '</dd></div>' +
    '</dl>';
  var body = groups.length
    ? groups.map(groupHtml).join('')
    : '<p class="empty">No comparison groups in this site build yet. A group needs values from different methods or codes ' +
      'for the same observable and material under identical physical conditions.</p>';
  document.getElementById('main').innerHTML =
    '<header class="page-head">' +
    '<p class="crumb"><a href="../experiment/">Experiments</a></p>' +
    '<p class="eyebrow">Evidence</p>' +
    '<h1>Cross-code agreement</h1>' +
    '<p class="lede">Each group below holds values of the same observable for the same material under identical physical ' +
    'conditions. The values differ only in the method or code that produced them, so the spread of a group (the range of its ' +
    'values divided by their mean) measures a difference between methods or codes.</p>' +
    '<p class="lede">Values share a group only when their base quantity, material, and every physical condition match and ' +
    'they differ only in estimator: the solver label, the method, or the code. The source paper does not count as a ' +
    'condition, so values from different papers can share a group.</p>' +
    '</header>' +
    '<div class="page-body"><div class="prose">' + summary + body + pinHtml() + '</div></div>';
  window.scrollTo(0, 0);
}

load().then(render, function(e){ fail('Could not load the agreement data: ' + e); });
</script>
<div data-site-footer></div>
<script src="../assets/site.js"></script>
</body>
</html>
