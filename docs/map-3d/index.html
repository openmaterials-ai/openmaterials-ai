<style>
  /* The 3D map is the same structure VIEW as the 2D map, lifted off the plane:
     nodes are the typed quantities, edges are the producing dependencies, and
     HEIGHT encodes tier progression (Sources lowest, later tiers higher). An app
     page: header, toolbar, the scene with the tier list, legend and panel
     floating over it. Colors are the site.css tokens (each var() carries the
     light value as its fallback); the scene reads them through #tokenProbe. */
  *{box-sizing:border-box;}
  html,body{overscroll-behavior:none;}
  body.app{height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page,#FFFFFF);color:var(--ink,#171717);font:400 14px/20px var(--font-sans,"Geist","Geist Fallback",ui-sans-serif,system-ui,sans-serif);-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:2px solid var(--ink,#171717);outline-offset:2px;}
  /* toolbar */
  .toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px var(--inset,16px);border-bottom:1px solid var(--line,#EBEBEB);background:var(--page,#FFFFFF);}
  .toolbar .om-search{flex:1 1 200px;max-width:360px;min-width:0;}
  .toolbar .push{margin-left:auto;}
  @media (max-width:960px){.toolbar .om-search{flex:1 1 100%;max-width:none;}}
  /* the stage: the WebGL scene fills it; the library empties #scene, so the
     overlays are its siblings */
  .canvas{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--canvas-dots,radial-gradient(circle at 1px 1px,var(--line,#EBEBEB) 1px,transparent 0) 0 0/24px 24px),var(--page,#FFFFFF);}
  #scene{position:absolute;inset:0;touch-action:none;}
  #scene canvas{display:block;outline:none;}
  /* The tier list: height decoded, top tier first (highest altitude). */
  #tiers{position:absolute;left:16px;top:16px;z-index:3;max-height:calc(100% - 96px);overflow-y:auto;display:flex;flex-direction:column;}
  #tiers .lad{padding:4px 8px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2,#4D4D4D);}
  #tiers button{padding:4px 8px;border:0;border-radius:var(--radius,6px);background:none;color:var(--ink-2,#4D4D4D);font:inherit;font-size:14px;line-height:20px;text-align:left;white-space:nowrap;cursor:pointer;transition:color var(--dur,150ms) var(--ease,ease);}
  #tiers button:hover{color:var(--ink,#171717);}
  @media (max-width:960px){#tiers{display:none;}}
  /* the static outline, shown when WebGL or the library is unavailable */
  #fallback{flex:1 1 auto;min-height:0;overflow:auto;padding:24px var(--inset,16px) 48px;display:none;}
  #fallback .ft{font-size:20px;line-height:28px;font-weight:450;color:var(--ink,#171717);margin:24px 0 4px;}
  #fallback .fd{color:var(--ink-2,#4D4D4D);margin-bottom:12px;}
  #fallback .fn{border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);padding:12px 16px;margin:8px 0;background:var(--surface,#FAFAFA);}
  #fallback .fn .fs{font-weight:500;color:var(--ink,#171717);}
  #fallback .fn .fk{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-left:8px;border-radius:9999px;background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-size:12px;font-weight:500;vertical-align:middle;}
  #fallback .fn .fe{color:var(--ink-2,#4D4D4D);margin-top:6px;}
  #banner{flex:none;margin:8px var(--inset,16px) 0;display:none;}
  /* legend, floating over the scene */
  .legend{position:absolute;left:16px;bottom:16px;z-index:4;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 12px;border-radius:var(--radius,6px);background:var(--page,#FFFFFF);box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));font-size:12px;line-height:16px;color:var(--ink-2,#4D4D4D);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .g{color:var(--ink,#171717);font-weight:500;}
  .legend .sep{width:1px;height:16px;background:var(--line,#EBEBEB);}
  .sw{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .sw.obs{background:var(--data-obs,#4F46E5);} .sw.hid{background:var(--ink-2,#4D4D4D);} .sw.param{background:var(--edge,#8F8F8F);}
  .sw.up{background:var(--ink,#171717);} .sw.down{background:var(--data-obs-line,#4F46E5);}
  @media (max-width:960px){.legend{display:none;}}
  /* the provenance panel floats top right; below 961 px it is a bottom sheet */
  .om-panel{position:absolute;top:16px;right:16px;z-index:5;width:360px;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;padding:20px;border:0;border-radius:12px;background:var(--page,#FFFFFF);box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));display:none;}
  @media (max-width:960px){.om-panel{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:55%;border-radius:12px 12px 0 0;}}
  .om-panel .x{float:right;width:32px;height:32px;margin:-8px -8px 0 8px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:var(--radius,6px);background:transparent;color:var(--ink,#171717);font:inherit;font-size:20px;line-height:1;cursor:pointer;}
  .om-panel .x:hover{background:var(--surface-2,#F2F2F2);}
  .om-panel-label{margin:16px 0 8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2,#4D4D4D);}
  .om-panel .sym{font-size:28px;color:var(--ink,#171717);}
  .om-panel .badge,.om-panel .tiertag{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-left:8px;border-radius:9999px;background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-family:var(--font-sans,"Geist",ui-sans-serif,system-ui,sans-serif);font-size:12px;font-weight:500;vertical-align:middle;}
  .om-panel .tiertag{color:var(--ink-2,#4D4D4D);}
  .om-panel .name{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);color:var(--ink-2,#4D4D4D);font-size:13px;margin:8px 0 0;overflow-wrap:anywhere;}
  .om-panel .uid{margin-top:4px;font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:12px;line-height:16px;color:var(--ink-2,#4D4D4D);overflow-wrap:anywhere;}
  .formula{background:var(--surface,#FAFAFA);border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);padding:12px;overflow-x:auto;}
  .formula code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px;color:var(--ink,#171717);white-space:pre-wrap;overflow-wrap:anywhere;}
  .fop{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:12px;color:var(--ink-2,#4D4D4D);margin:10px 0 4px;}
  .fop:first-of-type{margin-top:2px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font:inherit;font-size:18px;border:0;box-shadow:0 0 0 1px var(--line,#EBEBEB);background:var(--page,#FFFFFF);border-radius:var(--radius,6px);padding:4px 10px;color:var(--ink,#171717);cursor:pointer;transition:background-color var(--dur,150ms) var(--ease,ease);}
  .chip:hover{background:var(--surface-2,#F2F2F2);}
  .chip.up{box-shadow:0 0 0 1px var(--ink,#171717);} .chip.down{box-shadow:0 0 0 1px var(--data-obs-line,#4F46E5);}
  .chip code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px;}
  .om-panel .mapby .om-kv-k{font-weight:500;color:var(--ink,#171717);}
  .om-panel .mapby .om-kv-v{font-size:12px;max-width:190px;}
  .om-panel .traceline{margin-top:8px;padding:10px 12px;border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);background:var(--surface,#FAFAFA);color:var(--ink,#171717);}
  .om-panel .traceline b{font-weight:500;}
  .muted{color:var(--ink-2,#4D4D4D);}
  #err{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;display:none;white-space:pre-wrap;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important;}}
</style>

<script>
"use strict";
// ============================================================================
//  openmaterials 3D map: the structure graph lifted off the plane.
//  Reading order:
//    - shared     : DOM handles, helpers (tex fallback, esc), token colors
//    - data       : fetch graph.json ONLY, build adjacency + tier index
//    - layout     : force in x/z, tier index FIXES the y (height) coordinate
//    - encoding    : color by type, size by degree, dashed-ish parameter edges
//    - interaction: orbit/zoom (lib), click -> fly + panel +
//                   ancestry highlight (upstream ink / downstream indigo),
//                   search -> fly, escape/background clears, #node= deep link
//    - fallback   : static tier outline when WebGL / the lib is unavailable
//  Structure-pure: graph.json is the only network read; the instance/spectra
//  evidence layer is never fetched (the standing MVC ruling).
// ============================================================================

// ---- shared ----------------------------------------------------------------
const HAS_KATEX = (typeof katex!=='undefined');
const HAS_LIB   = (typeof ForceGraph3D!=='undefined');
const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sceneEl = document.getElementById('scene');
const panelEl = document.getElementById('panel');
const tokenProbe = document.getElementById('tokenProbe');

let Graph=null, nodeById={}, parents={}, children={}, symHtml={},
    codesData={}, tierList=[], tierIndex={}, degree={}, selId=null;

// tier -> vertical height. Sources sit lowest; each later tier is one step up.
// three.js has +y up, so higher tier index maps to a larger y.
const TIER_STEP = 60;

// Scene colors are the site tokens, read through a probe element (WebGL cannot
// read CSS variables), and re-read when the color scheme changes.
function token(n, fallback){ tokenProbe.style.color='var('+n+','+fallback+')'; return getComputedStyle(tokenProbe).color; }
function rgba(c, a){ const m=c.match(/[\d.]+/g)||[0,0,0]; return 'rgba('+m[0]+','+m[1]+','+m[2]+','+a+')'; }
let C={};
function readTokens(){
  C={ observable:token('--data-obs','#4F46E5'), hidden:token('--ink-2','#4D4D4D'), parameter:token('--edge','#8F8F8F'),
      sel:token('--ink','#171717'), up:token('--ink','#171717'), down:token('--data-obs-line','#4F46E5'), edge:token('--edge','#8F8F8F') };
}
readTokens();
function repaint(){ readTokens(); refreshEncoding(); }
if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

function err(m){ const e=document.getElementById('err'); e.style.display='block'; e.textContent='Error: '+m; }
function banner(m){ const b=document.getElementById('banner'); b.style.display='block'; b.textContent=m; }
function esc(s){ return (''+s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attr(s){ return (''+s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function tex(latex,display){
  if(latex==null) return '';
  if(HAS_KATEX){ try{ return katex.renderToString(latex,{throwOnError:false,displayMode:!!display}); }catch(e){ /* fall through */ } }
  return '<code>'+esc(''+latex)+'</code>';
}
function opName(op){ return (op||'').replace(/\[.*?\]/g,'').replace(/_/g,' ').trim() || 'operation'; }
function hashNode(){ const m=location.hash.match(/[#?&]node=([^&]*)/); return m?decodeURIComponent(m[1]):null; }

// ---- data ------------------------------------------------------------------
// The 3D map is the VIEW of the structure MODEL: nodes, edges, formulas, and the
// code representations mapped onto them. Values, instances, and spectra are a
// separate evidence layer that consumers load against node uids; this page never
// fetches or renders them (see the paper's MVC statement).
Promise.all([
  fetch('../data/graph.json').then(r=>r.json()),
  fetch('../data/codes.json').then(r=>r.json()).catch(()=>({}))
]).then(build).catch(e=> err('The map data did not load: '+e));

function build([graph, codes]){
  codesData = codes || {};
  graph.nodes.forEach(n=>{ nodeById[n.id]=n; symHtml[n.id]=tex(n.symbol); degree[n.id]=0; });

  const seen=new Set(), links=[];
  graph.links.forEach(l=>{ const k=l.source+'>>'+l.target;
    if(!seen.has(k) && l.source!==l.target && nodeById[l.source] && nodeById[l.target]){
      seen.add(k); links.push(l);
      (children[l.source]=children[l.source]||[]).push(l.target);
      (parents[l.target]=parents[l.target]||[]).push(l.source);
      degree[l.source]++; degree[l.target]++;
    }
  });

  tierList = (graph.tiers||[]).slice().sort((a,b)=> a.order-b.order);
  tierList.forEach((t,i)=>{ tierIndex[t.name]=i; });
  let needsOther=false;
  graph.nodes.forEach(n=>{ if(!(n.tier in tierIndex)) needsOther=true; });
  if(needsOther){ tierList.push({name:'Other', order:1e6, description:'Nodes without an assigned tier.'}); tierIndex['Other']=tierList.length-1; }

  if(!HAS_LIB){ renderFallback(graph); return; }
  try{ renderGraph(graph, links); }
  catch(e){ renderFallback(graph); banner('The 3D view could not start, possibly because WebGL is unavailable. The tiers are listed as text.'); }
}

function tierOf(n){ return (n.tier in tierIndex) ? tierIndex[n.tier] : tierIndex['Other']; }

// ---- layout + encoding -----------------------------------------------------
function renderGraph(graph, links){
  const nTiers = tierList.length;
  const gData = {
    nodes: graph.nodes.map(n=>{
      const ti = tierOf(n);
      return {
        id:n.id, type:n.type, tier:n.tier||'Other', tierIdx:ti,
        // FIX the vertical coordinate to the tier (height = progression).
        // Center the stack about y=0 so the whole graph frames symmetrically.
        fy: (ti - (nTiers-1)/2) * TIER_STEP,
        deg: degree[n.id]||0
      };
    }),
    links: links.map(l=>({ source:l.source, target:l.target, op:l.op||'', kind:l.kind||'' }))
  };

  // Frame once: fly to the #node= quantity, or fit the whole graph. The engine
  // stops on its first tick after the warmup, and the library moves the scene
  // objects to their positions only after calling onEngineStop, so the framing
  // waits one task; framing inside the callback fitted the stale starting
  // positions and left the camera close in.
  let framed=false;
  const frameOnce=()=>{ if(framed||!Graph) return; framed=true; const id=hashNode(); if(id&&nodeById[id]) selectNode(id); else fitAll(); };
  Graph = new ForceGraph3D(sceneEl)
    .warmupTicks(300).cooldownTicks(0)   // laid out before the first frame, then still
    .onEngineStop(()=> setTimeout(frameOnce, 0))
    .graphData(gData)
    .backgroundColor('rgba(0,0,0,0)')
    .showNavInfo(false)
    .nodeRelSize(4)
    .nodeVal(n=> (n.id===selId ? 3 : 1) * (1 + Math.min(6, (n.deg||0))*0.7))   // size by degree; the selected node, in ink like its sources, three times larger
    .nodeColor(n=> nodeColorFor(n))
    .nodeOpacity(0.95)
    .nodeResolution(12)
    // hover symbol: the plain node symbol string (KaTeX-free, plain, legible)
    .nodeLabel(n=> nodeLabelHtml(n))
    .linkColor(l=> linkColorFor(l))
    .linkWidth(l=> linkWidthFor(l))
    .linkOpacity(0.5)
    .linkDirectionalArrowLength(3.2)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalArrowColor(l=> linkColorFor(l))
    .onNodeClick(node=> selectNode(node.id))
    .onBackgroundClick(()=> clearSel())
    .onNodeHover(node=>{ sceneEl.style.cursor = node ? 'pointer' : 'grab'; });

  // The tier list: one entry per tier, top altitude first; click flies
  // the camera to that tier's plane so its nodes (e.g. Sources: Structure,
  // Potential, Temperature) are in front of you.
  (function(){
    const rail=document.getElementById('tiers'); if(!rail) return;
    tierList.slice().reverse().forEach(t=>{
      const b=document.createElement('button');
      b.type='button'; b.textContent=t.name; b.setAttribute('aria-label','Fly to the '+t.name+' tier');
      b.onclick=()=>{ const ti=tierIndex[t.name];
        const y=(ti-(nTiers-1)/2)*TIER_STEP;
        Graph.cameraPosition({x:0,y:y+TIER_STEP*0.6,z:420},{x:0,y:y,z:0},REDUCE?0:900); };
      rail.appendChild(b);
    });
  })();

  // Force layout: x/z are free (force cloud within each tier plane); y is fixed.
  // A gentle charge keeps the tiers readable; the link force sets spacing.
  Graph.d3Force('charge').strength(-260);
  const lf = Graph.d3Force('link'); if(lf) lf.distance(55);

  sizeToViewport();
  window.addEventListener('resize', sizeToViewport);

}

function sizeToViewport(){
  if(!Graph) return;
  Graph.width(sceneEl.clientWidth).height(sceneEl.clientHeight);
}

function nodeColorFor(n){
  if(!selId) return C[n.type] || C.parameter;
  if(n.id===selId) return C.sel;
  if(ancSet.has(n.id)) return C.up;          // upstream ink
  if(descSet.has(n.id)) return C.down;       // downstream indigo
  return rgba(C.edge, 0.22);                 // dimmed
}
function linkColorFor(l){
  const s=(l.source&&l.source.id)||l.source, t=(l.target&&l.target.id)||l.target;
  if(!selId){ return rgba(C.edge, l.kind==='param' ? 0.28 : 0.5); }
  if(upSet.has(s)&&upSet.has(t)) return rgba(C.up, 0.9);
  if(dnSet.has(s)&&dnSet.has(t)) return rgba(C.down, 0.85);
  return rgba(C.edge, 0.06);
}
function linkWidthFor(l){
  const s=(l.source&&l.source.id)||l.source, t=(l.target&&l.target.id)||l.target;
  if(selId && ((upSet.has(s)&&upSet.has(t))||(dnSet.has(s)&&dnSet.has(t)))) return 1.4;
  return l.kind==='param' ? 0.2 : 0.6;   // parameter edges thinner (dashed-ish)
}
function nodeLabelHtml(n){
  const node=nodeById[n.id]||{};
  const sym = node.symbol ? esc(node.symbol) : esc(n.id);
  return '<div style="font:500 13px/18px var(--font-sans,sans-serif);color:var(--ink,#171717);background:var(--page,#FFFFFF);'
       + 'border-radius:6px;padding:6px 10px;box-shadow:0 0 0 1px var(--line,#EBEBEB),0 16px 24px -8px rgb(0 0 0 / .06)">'
       + '<span style="font-family:var(--font-mono,monospace)">'+sym+'</span>'
       + ' <span style="color:var(--ink-2,#4D4D4D);font-weight:400">'+esc(n.id)+'</span></div>';
}

// ---- interaction: fit / fly ------------------------------------------------
function fitAll(){ if(Graph && Graph.zoomToFit) Graph.zoomToFit(REDUCE?0:600, 40); }
document.getElementById('resetView').addEventListener('click', fitAll);
function flyTo(id){
  if(!Graph) return;
  const n=(Graph.graphData().nodes||[]).find(x=>x.id===id);
  if(!n) return;
  const dist=90;
  const r=Math.hypot(n.x||0, n.z||0)||1;
  const ratio=1+dist/r;
  Graph.cameraPosition(
    { x:(n.x||0)*ratio, y:(n.y||0), z:(n.z||0)*ratio },
    { x:n.x||0, y:n.y||0, z:n.z||0 },
    REDUCE?0:900
  );
}

// ---- interaction: selection + ancestry (BFS, like the tracer) --------------
let ancSet=new Set(), descSet=new Set(), upSet=new Set(), dnSet=new Set();
function reach(id, adj){ const out=new Set(), dq=[id]; while(dq.length){ const x=dq.pop(); (adj[x]||[]).forEach(y=>{ if(!out.has(y)){ out.add(y); dq.push(y);} }); } return out; }

function selectNode(id){
  const node=nodeById[id]; if(!node) return;
  selId=id;
  ancSet=reach(id,parents); descSet=reach(id,children);
  upSet=new Set([id, ...ancSet]); dnSet=new Set([id, ...descSet]);
  refreshEncoding();
  flyTo(id);
  openPanel(node);
  history.replaceState(null,'','#node='+encodeURIComponent(id));
}
function clearSel(){
  selId=null; ancSet=new Set(); descSet=new Set(); upSet=new Set(); dnSet=new Set();
  refreshEncoding();
  panelEl.style.display='none';
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
window.addEventListener('hashchange', ()=>{ const id=hashNode(); if(id&&id!==selId&&nodeById[id]) selectNode(id); });
// re-evaluate the color/width accessors so the highlight repaints.
function refreshEncoding(){
  if(!Graph) return;
  Graph.nodeColor(Graph.nodeColor())
       .nodeVal(Graph.nodeVal())
       .linkColor(Graph.linkColor())
       .linkWidth(Graph.linkWidth())
       .linkDirectionalArrowColor(l=> linkColorFor(l));
}

window.navTo=function(id){ if(nodeById[id]) selectNode(id); };
function chip(id, cls){ return '<button type="button" class="chip '+(cls||'')+'" onclick="navTo(\''+attr(id).replace(/'/g,"&#39;")+'\')">'+(symHtml[id]||esc(id))+'</button>'; }

function mappedByHtml(id){
  const rows=Object.keys(codesData).filter(c=> codesData[c] && codesData[c][id]).sort().map(c=>{ const m=codesData[c][id]; return '<div class="om-kv-row"><span class="om-kv-k">'+esc(c)+'</span><span class="om-kv-v">'+esc((m.api||''))+(m.unit?(' · '+esc(m.unit)):'')+'</span></div>'; });
  return rows.length? ('<div class="om-panel-label">Mapped by '+rows.length+' code'+(rows.length>1?'s':'')+'</div><div class="mapby om-kv">'+rows.join('')+'</div>') : '';
}
function openPanel(node){
  const id=node.id;
  const ins=parents[id]||[], outs=children[id]||[];
  const nAnc=ancSet.size, nDesc=descSet.size;
  let h='<button type="button" class="x" aria-label="Close" onclick="clearSel()">&times;</button>';
  h+='<div><span class="sym">'+tex(node.symbol)+'</span><span class="badge '+node.type+'">'+esc(node.type)+'</span></div>';
  h+='<div class="name">'+esc(node.id)+'<span class="tiertag">'+esc(node.tier||'Other')+'</span>'+'</div>'+(node.uid?('<div class="uid">uid '+esc(node.uid)+'</div>'):'');
  const routes=(node.formulas||[]).length;
  h+='<div class="traceline">'+(nAnc?('Built from '+nAnc+' upstream quantit'+(nAnc>1?'ies':'y')+(routes>1?' across '+routes+' routes':'')+'.'):'An input quantity.')+' '+(nDesc?('Feeds '+nDesc+' downstream quantit'+(nDesc>1?'ies':'y')+'.'):'Nothing on the map uses it.')+'</div>';
  const fl=(node.formulas&&node.formulas.length)?node.formulas:(node.formula?[{op:'',latex:node.formula}]:[]);
  if(!fl.length){ h+='<div class="om-panel-label">Formula on the producing edge</div><div class="formula"><span class="muted">Input quantity: no edge produces it.</span></div>'; }
  else{   // every formula with the operator that carries it
    h+='<div class="om-panel-label">'+(fl.length===1?'Formula on the producing edge':fl.length+' producing edges (alternative routes)')+'</div>';
    fl.forEach(f=>{ h+=(f.op?'<div class="fop">'+esc(f.op)+'</div>':'')+'<div class="formula">'+tex(f.latex,true)+'</div>'; });
  }
  if(outs.length){ h+='<div class="om-panel-label">Feeds into</div><div class="chips">'+outs.map(id=>chip(id,'down')).join('')+'</div>'; }
  if(ins.length){ h+='<div class="om-panel-label">Computed from</div><div class="chips">'+ins.map(id=>chip(id,'up')).join('')+'</div>'; }
  h+=mappedByHtml(id);
  panelEl.innerHTML=h; panelEl.style.display='block';
}

// The view switch carries the selection: the current #node= rides along to the other view.
document.querySelector('.view-switch').addEventListener('click', e=>{
  const a=e.target.closest('a'), m=location.hash.match(/[#?&]node=([^&]*)/);
  if(a&&m) a.hash='node='+m[1];
});

// ---- interaction: search (fly to the match) --------------------------------
// on change (Enter or leaving the field), so typing does not fly the camera at each key
document.getElementById('q').addEventListener('change', function(){
  const v=this.value.trim().toLowerCase(); if(!v){ clearSel(); return; }
  const hits=Object.values(nodeById).filter(n=> (n.id+' '+(n.symbol||'')).toLowerCase().includes(v));
  if(!hits.length) return;
  // exact-ish first: prefer an id/symbol that starts with the query.
  hits.sort((a,b)=> (a.id.toLowerCase().indexOf(v)) - (b.id.toLowerCase().indexOf(v)));
  selectNode(hits[0].id);
});

// ---- keyboard: Escape clears ----------------------------------------------
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(selId||panelEl.style.display==='block'){ clearSel(); const q=document.getElementById('q'); if(q) q.value=''; } }
});

// ---- fallback: static readable tier outline --------------------------------
function renderFallback(graph){
  banner('The 3D library did not load, so the tiers are listed as text.');
  document.getElementById('stage').style.display='none';
  const fb=document.getElementById('fallback'); fb.style.display='block';
  const byTier={};
  graph.nodes.forEach(n=>{ const t=(n.tier in tierIndex)?n.tier:'Other'; (byTier[t]=byTier[t]||[]).push(n); });
  let s='';
  tierList.forEach(t=>{
    const list=byTier[t.name]||[];
    s+='<div class="ft">'+esc(t.name)+'</div><div class="fd">'+esc(t.description||'')+'</div>';
    list.forEach(n=>{
      const outs=(children[n.id]||[]);
      s+='<div class="fn"><span class="fs">'+(symHtml[n.id]||'')+' '+esc(n.id)+'</span><span class="fk '+n.type+'">'+esc(n.type)+'</span>';
      if(outs.length){
        const edg=outs.map(t2=>'<span>&rarr;</span> '+esc(t2));
        s+='<div class="fe">'+edg.join('<br>')+'</div>';
      }
      s+='</div>';
    });
  });
  fb.innerHTML=s;
}
</script>
