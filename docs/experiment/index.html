<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-site-header></div>
<main class="frame" id="main">
  <header class="page-head" id="xp-head">
    <p class="eyebrow">Evidence</p>
    <h1>Values by source</h1>
    <p class="lede">One page per paper or run, with its values, their conditions, and their provenance.</p>
  </header>
  <div class="page-body"><div class="prose" id="xp-body">
    <noscript><p class="empty">This page needs JavaScript. The records are plain JSON in <a href="../data/instances.json">../data/instances.json</a>.</p></noscript>
  </div></div>
</main>
<script src="../assets/vendor/katex/dist/katex.min.js"></script>
<script>
'use strict';
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// MaterialsCodeGraph runs thermal conductivity today, so a source with a simulated value of it
// gets the link. It opens the sign-up panel: the app itself ends on a sign-in.
var MCG_CONNECT = 'https://materialscodegraph.com/?ref=omai-experiment#hero-connect';
function runnable(recs){
  return recs.some(function(r){
    return r.source && r.source.kind === 'simulation' && /^ThermalConductivity(\[|$)/.test(r.variable);
  });
}
// A paper record's detail reads "<quote> (p. N). <citation>, doi:..., arXiv:..."; a measurement's
// may open with its citation ("Glassbrenner and Slack, Phys. Rev. 134, A1058 (1964); ...").
// Bracketed curator notes never render.
function parts(detail){
  var d = String(detail == null ? '' : detail).replace(/\s+/g, ' ').replace(/ ?\[[A-Z]{2,}[^\]]*\]/g, '').trim();
  var m = /^(.*\([^()]*\bp\. ?\d+[^()]*\))\.? (.+)$/.exec(d);
  if (m) return { quote: m[1], cite: m[2].replace(/,? (?:doi|arXiv):.*$/, '').replace(/\.$/, '') };
  m = /^([^;()]*\(\d{4}\))(?:; (.*))?$/.exec(d);
  if (m) return { quote: m[2] || '', cite: m[1] };
  return { quote: d, cite: '' };
}
// A source is titled by its citation: the shortest one its records carry (a curator note that
// precedes a citation makes that record's longer). A source without one keeps its ref.
function titleOf(recs){
  var best = '';
  recs.forEach(function(r){
    var c = parts(r.source && r.source.detail).cite;
    if (c && (!best || c.length < best.length)) best = c;
  });
  return best;
}
// Refs that differ only in a numbered suffix (ethanol-bond0 to -bond7) are one source.
function family(ref){ return String(ref).replace(/-[a-z]+\d+$/i, ''); }
function tex(s){
  if (!s) return '';
  try { return katex.renderToString(String(s), { throwOnError: false }); } catch (e) { return esc(s); }
}
function condText(c){
  if (!c || typeof c !== 'object') return '';
  return Object.keys(c).map(function(k){ return k + ' = ' + c[k]; }).join(' · ');
}
function fail(msg){
  document.getElementById('xp-body').innerHTML =
    '<p id="err" class="notice notice--error">' + esc(msg) + '</p>';
}
function valText(rec){
  var v = esc(rec.value);
  if (rec.uncertainty != null) v += ' ± ' + esc(rec.uncertainty);
  if (rec.units) v += ' <span class="u">' + esc(rec.units) + '</span>';
  return v;
}
function uniq(arr){
  var seen = {}, out = [];
  arr.forEach(function(x){ if (x != null && !seen[x]) { seen[x] = 1; out.push(x); } });
  return out;
}
function refFromHash(){
  var m = location.hash.match(/[#?&]ref=([^&]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function materialFromHash(){
  var m = location.hash.match(/[#?&]material=([^&]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

var DATA = null;   // {records, groups, catalog, version}
function load(){
  return Promise.all([
    fetch('../data/instances.json').then(function(r){ return r.json(); }),
    fetch('../data/catalog.json').then(function(r){ return r.json(); }),
    fetch('../data/version.json').then(function(r){ return r.json(); })
  ]).then(function(res){
    var records = res[0], catalog = {}, version = res[2];
    res[1].forEach(function(n){ catalog[n.id] = n; });
    var byRef = {}, fams = {}, groups = {};
    records.forEach(function(rec){
      var ref = (rec.source && rec.source.ref) || '(unsourced)';
      (byRef[ref] = byRef[ref] || []).push(rec);
    });
    Object.keys(byRef).forEach(function(ref){ (fams[family(ref)] = fams[family(ref)] || []).push(ref); });
    Object.keys(fams).forEach(function(f){
      var refs = fams[f];
      if (refs.length === 1) groups[refs[0]] = byRef[refs[0]];
      else groups[f] = [].concat.apply([], refs.map(function(r){ return byRef[r]; }));
    });
    DATA = { records: records, groups: groups, catalog: catalog, version: version };
  });
}

function pinHtml(){
  var v = ((DATA.version && DATA.version.version) || '').slice(0, 12);
  return v ? '<p class="notice pin"><a href="../#cite">Cite the map version</a>, <span class="mono">' + esc(v) +
    '</span>, with any value you reuse.</p>' : '';
}
// The index head is the static one in the HTML; a detail view swaps in its own head.
var INDEX_HEAD = document.getElementById('xp-head').innerHTML;
function page(head, body){
  document.getElementById('xp-head').innerHTML = head;
  document.getElementById('xp-body').innerHTML = body + pinHtml();
}

function renderIndex(material){
  document.title = 'Values by source | OpenMaterials';
  var refs = Object.keys(DATA.groups).sort(function(a, b){
    return DATA.groups[b].length - DATA.groups[a].length || a.localeCompare(b);
  });
  if (material){
    var needle = material.toLowerCase();
    refs = refs.filter(function(ref){
      return DATA.groups[ref].some(function(r){
        return String(r.material).toLowerCase().indexOf(needle) !== -1;
      });
    });
  }
  var rows = refs.map(function(ref){
    var recs = DATA.groups[ref];
    var mats = uniq(recs.map(function(r){ return r.material; }));
    var kinds = uniq(recs.map(function(r){ return r.source && r.source.kind; }));
    var vars = uniq(recs.map(function(r){ return r.variable; }));
    return '<div class="xp-row"><dt><a class="ref" href="#ref=' + encodeURIComponent(ref) + '">' + esc(titleOf(recs) || ref) + '</a></dt>' +
      '<dd>' + recs.length + (recs.length === 1 ? ' value' : ' values') + ' · ' + esc(kinds.join(', ')) + ' · ' +
        esc(mats.join(', ')) + ' · ' + vars.length +
        (vars.length === 1 ? ' quantity' : ' quantities') + '</dd></div>';
  }).join('');
  page(INDEX_HEAD,
    (material ? '<div class="meta"><span class="pill">Material ' + esc(material) +
      '</span><a class="pill" href="#">Clear filter</a></div>' : '') +
    (rows ? '<dl class="ledger xp-list">' + rows + '</dl>' :
      '<p class="empty">No source matches that material.</p>'));
}

function renderDetail(ref){
  // an older link may name one member of a numbered family
  var key = DATA.groups[ref] ? ref : family(ref), recs = DATA.groups[key];
  if (!recs){
    document.title = 'Unknown source | OpenMaterials';
    page(
      '<p class="crumb"><a href="#">All sources</a></p>' +
      '<h1>Unknown source</h1>' +
      '<p class="lede">No committed value carries the reference <span class="mono">' +
      esc(ref) + '</span>. Check it for a typo.</p>', '');
    return;
  }
  var title = titleOf(recs);
  document.title = (title || key) + ' | OpenMaterials';
  var mats = uniq(recs.map(function(r){ return r.material; }));
  var kinds = uniq(recs.map(function(r){ return r.source && r.source.kind; }));
  var sorted = recs.slice().sort(function(a, b){
    return a.variable.localeCompare(b.variable) || String(a.material).localeCompare(String(b.material));
  });
  var rows = sorted.map(function(rec){
    var node = DATA.catalog[rec.variable.replace(/\[.*$/, '')] || DATA.catalog[rec.variable] || {};
    return '<tr>' +
      '<td class="var" data-label="Quantity"><span class="sym">' + tex(node.symbol) + '</span>' +
      '<a class="vid" href="../map/#node=' + encodeURIComponent(rec.variable) +
      '" title="Open this quantity on the map">' + esc(rec.variable) + '</a></td>' +
      '<td class="mat" data-label="Material">' + esc(rec.material) + '</td>' +
      '<td class="cond" data-label="Conditions">' + esc(condText(rec.conditions)) + '</td>' +
      '<td class="val" data-label="Value">' + valText(rec) + '</td>' +
      '</tr>';
  }).join('');
  // with the citation in the title, each record shows only its quoted passage
  var quotes = uniq(sorted.map(function(r){ return parts(r.source && r.source.detail).quote || null; }))
    .map(function(d){ return '<blockquote class="quote">' + esc(d) + '</blockquote>'; }).join('');
  var facts =
    '<dl class="ledger">' +
    '<div><dt>Kind</dt><dd>' + esc(kinds.join(', ')) + '</dd></div>' +
    '<div><dt>Values</dt><dd class="mono">' + recs.length + '</dd></div>' +
    '<div><dt>Materials</dt><dd>' + mats.map(function(m){
      return '<a href="#material=' + encodeURIComponent(m) + '">' + esc(m) + '</a>'; }).join(', ') + '</dd></div>' +
    '</dl>';
  var runBtn = runnable(recs) ? '<a class="btn btn--secondary btn--sm" href="' + MCG_CONNECT + '">Run it for your material</a>' : '';
  var mapRef = (recs[0].source && recs[0].source.ref) || key;   // the map marks one ref's quantities
  page(
    '<p class="crumb"><a href="#">All sources</a></p>' +
    '<p class="eyebrow">Source</p>' +
    '<h1 class="' + (title ? 'cite' : 'ref') + '">' + esc(title || key) + '</h1>' +
    '<div class="cta-row"><button class="btn btn--primary btn--sm" id="copy" type="button">Copy link</button>' +
    '<a class="btn btn--secondary btn--sm" href="../map/#experiment=' + encodeURIComponent(mapRef) + '">View on the map</a>' +
    runBtn +
    '<span class="copied small" id="copied" aria-live="polite"></span></div>',
    facts +
    '<h2>Values</h2>' +
    '<div class="table-wrap"><table class="table stack"><thead><tr>' +
    '<th>Quantity</th><th>Material</th><th>Conditions</th><th>Value</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (quotes ? '<h2>Provenance</h2>' + quotes : ''));
  document.getElementById('copy').addEventListener('click', function(){
    var url = location.href;
    var done = function(){
      var el = document.getElementById('copied');
      el.textContent = 'Link copied';
      setTimeout(function(){ el.textContent = ''; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.prompt('Copy this link:', url); });
    } else {
      window.prompt('Copy this link:', url);
    }
  });
}

function render(){
  var ref = refFromHash();
  if (ref) renderDetail(ref); else renderIndex(materialFromHash());
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
load().then(render, function(e){ fail('Could not load the values: ' + e); });
</script>
<div data-site-footer></div>
<script src="../assets/site.js"></script>
