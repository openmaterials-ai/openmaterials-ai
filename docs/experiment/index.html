<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-site-header></div>
<main class="frame" id="main">
  <header class="page-head" id="xp-head">
    <p class="eyebrow">Evidence</p>
    <h1>Experiments</h1>
    <p class="lede">Committed values are grouped by source reference, with one page for each. Each page's URL carries the reference, and the page shows the map version it renders.</p>
  </header>
  <div class="page-body"><div class="prose" id="xp-body">
    <noscript><p class="empty">This page needs JavaScript. The records are plain JSON in <a href="../data/instances.json">../data/instances.json</a>.</p></noscript>
  </div></div>
</main>
<script>
'use strict';
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ---- "Run on MaterialsCodeGraph" deep link (#25) --------------------------
   OPTIONAL, additive, storage-free: for a card whose node MCG can actually run,
   one more action-row link deep-links MCG's compute wizard at #/new/<node_id>
   (materialscodegraph#65), prefilled from the lineage. Hidden otherwise: precision
   over reach, only genuinely runnable nodes get the link, and the card is
   identical without it. Nothing here touches the store, a record, or identity. */
var MCG_BASE = 'https://app.materialscodegraph.com';   // one place to change

// The known-computable set: base map nodes MCG has a wired engine for right now.
// Static by choice (the plan's Q3, YAGNI: no soft capability fetch, no network).
// MCG's runnable kinds today are its thermal-transport verticals (device_thermal,
// full_stack, composite_kappa), whose headline output is thermal conductivity, so
// this is deliberately the ThermalConductivity family and nothing it cannot boot a
// pod for. It is expected to GROW as MCG wires more kinds; extend this list then.
var MCG_COMPUTABLE = { 'ThermalConductivity': 1 };

// A variable/node id may carry a bracket qualifier (an estimator/method pin,
// e.g. ThermalConductivity[bte_solver=direct_inverse]); the runnable KIND is the
// base node, so computability keys on the base.
function baseNode(id){ return String(id == null ? '' : id).replace(/\[.*$/, ''); }
function isComputable(id){ return !!MCG_COMPUTABLE[baseNode(id)]; }

// The material's configuration uid, when a record's material pins one (a pinned
// atomic configuration): a bare-string material.configuration, or a {uid} /
// {configuration:{uid}} / {canonical:{uid}} object form. Returns '' otherwise.
// Kept verbatim (a "sha256:" prefix is passed through; MCG strips it server-side).
// Mirrors the play page's helper so the two Run links carry the same pin.
function materialConfigUid(material){
  if (!material || typeof material !== 'object') return '';
  var u = (typeof material.configuration === 'string' ? material.configuration : null) ||
    material.uid || material.config_uid || material.configuration_uid ||
    (material.configuration && typeof material.configuration === 'object' && material.configuration.uid) ||
    (material.canonical && typeof material.canonical === 'object' && material.canonical.uid);
  return u ? String(u) : '';
}

// The runnable node id for a group of records: the first record whose base node
// MCG can run (there may be several variables under one source ref). Returns the
// record so the caller can prefill material/conditions from it, or null when the
// group has nothing MCG can run (the link then does not render).
function computableRec(recs){
  for (var i = 0; i < recs.length; i++) { if (isComputable(recs[i].variable)) return recs[i]; }
  return null;
}

// The MCG compute deep link for a runnable record: #/new/<node_id>, with the
// base node id (the runnable kind), plus material and conditions passed as query
// params when trivially in scope so the wizard can prefill. Q1 (the canonical
// card URL) is the owner's open call; where a back-link to this openmaterials
// card is wanted, the PORTABLE #x= form is the self-contained shareable identity,
// so a back-link would carry the lineage in the fragment rather than invent a
// server route. It is left off the deep link here (the reciprocal seam (c) ships
// MCG-side and Q1 is undecided); the const and the base node keep it a one-line
// add if the owner decides to include it.
function mcgRunUrl(rec){
  var url = MCG_BASE + '/#/new/' + encodeURIComponent(baseNode(rec.variable));
  var qs = [];
  var mat = rec.material;
  if (mat != null && mat !== '') {
    qs.push('material=' + encodeURIComponent(typeof mat === 'object' && mat.name != null ? mat.name : mat));
  }
  if (rec.conditions && typeof rec.conditions === 'object') {
    var c = condText(rec.conditions);
    if (c) qs.push('conditions=' + encodeURIComponent(c));
  }
  var cfgUid = materialConfigUid(rec.material);
  if (cfgUid) qs.push('configuration=' + encodeURIComponent(cfgUid));
  return qs.length ? url + '?' + qs.join('&') : url;
}
function condText(c){
  if (!c || typeof c !== 'object') return '';
  return Object.keys(c).map(function(k){ return k + ' = ' + c[k]; }).join(' · ');
}
function fail(msg){
  document.getElementById('xp-body').innerHTML =
    '<p id="err" class="notice notice--error">' + esc(msg) + '</p>';
}
function valText(rec){
  var v = esc(rec.value);
  if (rec.uncertainty != null) v += ' ± ' + esc(rec.uncertainty);
  if (rec.units) v += ' <span class="u">' + esc(rec.units) + '</span>';
  return v;
}
function uniq(arr){
  var seen = {}, out = [];
  arr.forEach(function(x){ if (x != null && !seen[x]) { seen[x] = 1; out.push(x); } });
  return out;
}
function refFromHash(){
  var m = location.hash.match(/[#?&]ref=([^&]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function materialFromHash(){
  var m = location.hash.match(/[#?&]material=([^&]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

var DATA = null;   // {records, groups, catalog, version}
function load(){
  return Promise.all([
    fetch('../data/instances.json').then(function(r){ return r.json(); }),
    fetch('../data/catalog.json').then(function(r){ return r.json(); }),
    fetch('../data/version.json').then(function(r){ return r.json(); })
  ]).then(function(parts){
    var records = parts[0], catalog = {}, version = parts[2];
    parts[1].forEach(function(n){ catalog[n.id] = n; });
    var groups = {};
    records.forEach(function(rec){
      var ref = (rec.source && rec.source.ref) || '(unsourced)';
      (groups[ref] = groups[ref] || []).push(rec);
    });
    DATA = { records: records, groups: groups, catalog: catalog, version: version };
  });
}

function pinHtml(){
  var v = (DATA.version && DATA.version.version) || '';
  return '<p class="notice pin">Map version <span class="mono">' + esc(v.slice(0, 12)) + '</span>' +
    (v ? ' (<span class="mono">' + esc(v) + '</span>)' : '') +
    '. This page shows the values committed in the current site build. Cite the map version with any value you reuse.' +
    '<br>Contributors grant OpenMaterials-AI a non-exclusive license to redistribute each record under CC BY 4.0 and keep every other right. Raw artifacts are never ingested, and reuse credits the source named in the record\'s provenance ' +
    '(<a href="https://github.com/openmaterials-ai/openmaterials-ai/blob/main/GOVERNANCE.md#data-ownership-and-fairness">GOVERNANCE.md, "Data ownership and fairness"</a>).</p>';
}
// The index head is the static one in the HTML; a detail view swaps in its own head.
var INDEX_HEAD = document.getElementById('xp-head').innerHTML;
function page(head, body){
  document.getElementById('xp-head').innerHTML = head;
  document.getElementById('xp-body').innerHTML = body + pinHtml();
}

function renderIndex(material){
  document.title = 'Experiments | OpenMaterials';
  var refs = Object.keys(DATA.groups).sort(function(a, b){
    return DATA.groups[b].length - DATA.groups[a].length || a.localeCompare(b);
  });
  if (material){
    var needle = material.toLowerCase();
    refs = refs.filter(function(ref){
      return DATA.groups[ref].some(function(r){
        return String(r.material).toLowerCase().indexOf(needle) !== -1;
      });
    });
  }
  var rows = refs.map(function(ref){
    var recs = DATA.groups[ref];
    var mats = uniq(recs.map(function(r){ return r.material; }));
    var kinds = uniq(recs.map(function(r){ return r.source && r.source.kind; }));
    var vars = uniq(recs.map(function(r){ return r.variable; }));
    return '<div class="xp-row"><dt><a class="ref" href="#ref=' + encodeURIComponent(ref) + '">' + esc(ref) + '</a></dt>' +
      '<dd>' + recs.length + (recs.length === 1 ? ' value' : ' values') + ' · ' + esc(kinds.join(', ')) + ' · ' +
        esc(mats.join(', ')) + ' · ' + vars.length +
        (vars.length === 1 ? ' quantity' : ' quantities') + '</dd></div>';
  }).join('');
  page(INDEX_HEAD,
    (material ? '<div class="meta"><span class="pill">Material ' + esc(material) +
      '</span><a class="pill" href="#">Clear filter</a></div>' : '') +
    (rows ? '<dl class="ledger xp-list">' + rows + '</dl>' :
      '<p class="empty">No experiment in this site build matches that material.</p>'));
}

function renderDetail(ref){
  var recs = DATA.groups[ref];
  document.title = 'Experiment ' + ref + ' | OpenMaterials';
  if (!recs){
    page(
      '<p class="crumb"><a href="#">All experiments</a></p>' +
      '<h1>Unknown experiment</h1>' +
      '<p class="lede">No committed value in this site build carries the reference <span class="mono">' +
      esc(ref) + '</span>. It may belong to a newer build, or the reference may be mistyped.</p>', '');
    return;
  }
  var mats = uniq(recs.map(function(r){ return r.material; }));
  var kinds = uniq(recs.map(function(r){ return r.source && r.source.kind; }));
  var sorted = recs.slice().sort(function(a, b){
    return a.variable.localeCompare(b.variable) || String(a.material).localeCompare(String(b.material));
  });
  var rows = sorted.map(function(rec){
    var node = DATA.catalog[rec.variable.replace(/\[.*$/, '')] || DATA.catalog[rec.variable] || {};
    return '<tr>' +
      '<td class="var" data-label="Quantity"><span class="sym">' + esc(node.symbol || '') + '</span>' +
      '<a class="vid" href="../map/#node=' + encodeURIComponent(rec.variable) +
      '" title="Open this quantity on the map">' + esc(rec.variable) + '</a></td>' +
      '<td class="mat" data-label="Material">' + esc(rec.material) + '</td>' +
      '<td class="cond" data-label="Conditions">' + esc(condText(rec.conditions)) + '</td>' +
      '<td class="val" data-label="Value">' + valText(rec) + '</td>' +
      '</tr>';
  }).join('');
  var quotes = uniq(sorted.map(function(r){ return r.source && r.source.detail; }))
    .map(function(d){ return '<blockquote class="quote">' + esc(d) + '</blockquote>'; }).join('');
  var facts =
    '<dl class="ledger">' +
    '<div><dt>Kind</dt><dd>' + esc(kinds.join(', ')) + '</dd></div>' +
    '<div><dt>Values</dt><dd class="mono">' + recs.length + '</dd></div>' +
    '<div><dt>Materials</dt><dd>' + mats.map(function(m){
      return '<a href="#material=' + encodeURIComponent(m) + '">' + esc(m) + '</a>'; }).join(', ') + '</dd></div>' +
    '</dl>';
  // Optional "Run on MaterialsCodeGraph" link (#25): shown only when this
  // group has a node MCG can actually run, deep-linking its compute wizard
  // prefilled from that record. Absent otherwise (the card is identical).
  var runRec = computableRec(recs);
  var runBtn = runRec ? '<a class="btn btn--secondary btn--sm" href="' + esc(mcgRunUrl(runRec)) +
    '" target="_blank" rel="noopener">Run on MaterialsCodeGraph</a>' : '';
  page(
    '<p class="crumb"><a href="#">All experiments</a></p>' +
    '<p class="eyebrow">Experiment</p>' +
    '<h1 class="ref">' + esc(ref) + '</h1>' +
    '<div class="cta-row"><button class="btn btn--primary btn--sm" id="copy" type="button">Copy link</button>' +
    '<a class="btn btn--secondary btn--sm" href="../map/#experiment=' + encodeURIComponent(ref) + '">View on the map</a>' +
    runBtn +
    '<span class="copied small" id="copied" aria-live="polite"></span></div>',
    facts +
    '<h2>Values</h2>' +
    '<div class="table-wrap"><table class="table stack"><thead><tr>' +
    '<th>Quantity</th><th>Material</th><th>Conditions</th><th>Value</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<h2>Provenance</h2>' + quotes);
  document.getElementById('copy').addEventListener('click', function(){
    var url = location.href;
    var done = function(){
      var el = document.getElementById('copied');
      el.textContent = 'Link copied';
      setTimeout(function(){ el.textContent = ''; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.prompt('Copy this link:', url); });
    } else {
      window.prompt('Copy this link:', url);
    }
  });
}

function render(){
  var ref = refFromHash();
  if (ref) renderDetail(ref); else renderIndex(materialFromHash());
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
load().then(render, function(e){ fail('Could not load the values: ' + e); });
</script>
<div data-site-footer></div>
<script src="../assets/site.js"></script>
</body>
