  /* The 2D map, an app page: header, toolbar, a full-bleed canvas with the
     panel and legend floating over it. Colors are the site.css tokens; each
     var() carries the light value as its fallback. */
  @layer om-fallback {
    /* Shared components. Unlayered site.css rules win over these once it defines them. */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:9999px;font:inherit;font-weight:500;font-size:16px;line-height:24px;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color var(--dur,150ms) var(--ease,ease),color var(--dur,150ms) var(--ease,ease);}
    .btn--sm{height:32px;padding:0 12px;border-radius:var(--radius,6px);font-size:14px;line-height:20px;}
    .btn--secondary{background:var(--page,#FFFFFF);color:var(--ink,#171717);box-shadow:0 0 0 1px var(--line,#EBEBEB);}
    .btn--ghost{background:transparent;color:var(--ink,#171717);}
    .btn--secondary:hover,.btn--ghost:hover{background:var(--surface-2,#F2F2F2);}
    .select{height:32px;min-width:0;max-width:100%;padding:0 8px;border:0;border-radius:var(--radius,6px);box-shadow:0 0 0 1px var(--line,#EBEBEB);background:var(--page,#FFFFFF);color:var(--ink,#171717);font:inherit;font-size:14px;line-height:20px;}
    .view-switch{display:inline-flex;gap:2px;height:32px;padding:2px;border-radius:var(--radius,6px);box-shadow:0 0 0 1px var(--line,#EBEBEB);}
    .view-switch a{display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;font-weight:500;font-size:14px;line-height:20px;color:var(--ink-2,#4D4D4D);text-decoration:none;}
    .view-switch a:hover{color:var(--ink,#171717);}
    .view-switch a[aria-current="page"]{color:var(--ink,#171717);background:var(--surface-2,#F2F2F2);}
    .notice{padding:12px 16px;border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);background:var(--surface,#FAFAFA);font-size:14px;line-height:20px;color:var(--ink,#171717);}
    .notice--error{border-color:var(--ink,#171717);}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
    .hint{display:flex;gap:12px;align-items:center;color:var(--ink-2,#4D4D4D);white-space:nowrap;}
    kbd{font:400 12px/16px var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);padding:1px 4px;border-radius:4px;box-shadow:0 0 0 1px var(--line,#EBEBEB);color:var(--ink,#171717);}
    @media (max-width:960px){.hint{display:none;}}
  }
  *{box-sizing:border-box;}
  body.app{height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page,#FFFFFF);color:var(--ink,#171717);font:400 14px/20px var(--font-sans,"Geist","Geist Fallback",ui-sans-serif,system-ui,sans-serif);-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:2px solid var(--ink,#171717);outline-offset:2px;}
  /* toolbar */
  .toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px var(--inset,16px);border-bottom:1px solid var(--line,#EBEBEB);background:var(--page,#FFFFFF);}
  .toolbar .om-search{flex:1 1 200px;max-width:360px;min-width:0;}
  .toolbar .push{margin-left:auto;}
  .toolbar .select{max-width:160px;}   /* the open list shows full names */
  @media (max-width:960px){.toolbar .om-search{flex:1 1 100%;max-width:none;} #zoomOut,#zoomIn{display:none;}}
  @media (max-width:600px){#codeFilter,#copylink{display:none;} #tierJump{flex:1 1 0;}}
  /* canvas */
  .canvas{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--canvas-dots,radial-gradient(circle at 1px 1px,var(--line,#EBEBEB) 1px,transparent 0) 0 0/24px 24px),var(--page,#FFFFFF);}
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;} #svg.drag{cursor:grabbing;}
  /* tier bands */
  .band rect{fill:var(--surface,#FAFAFA);}
  .band .bl{stroke:var(--line,#EBEBEB);stroke-width:1;vector-effect:non-scaling-stroke;}
  .band .ord{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);fill:var(--ink-2,#4D4D4D);}
  .band .h{font-weight:450;fill:var(--ink,#171717);}
  .band .sh{fill:var(--ink-2,#4D4D4D);}
  #svg.far .band .sh,#svg.far .band .ord{display:none;}   /* 16-unit text hides below 12 px */
  /* edges: 1px base; parameter links dashed (data encoding); hot edges observable indigo */
  .edge{fill:none;stroke:var(--edge,#8F8F8F);stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity var(--dur,150ms) var(--ease,ease);}
  .edge.param{stroke-dasharray:3 3;opacity:.6;}
  .edge.hot{stroke:var(--data-obs-line,#4F46E5);stroke-width:2;marker-end:url(#arrowhot);}
  .edge.dim{opacity:.08;}
  /* nodes */
  .node{cursor:pointer;}
  .node:focus{outline:none;} .node:focus-visible{outline:2px solid var(--ink,#171717);outline-offset:2px;}
  .node rect{stroke-width:1;vector-effect:non-scaling-stroke;}
  .node.obs rect{fill:var(--data-obs,#4F46E5);stroke:var(--data-obs,#4F46E5);}
  .node.hid rect{fill:var(--surface-2,#F2F2F2);stroke:var(--edge,#8F8F8F);}
  .node.param rect{fill:var(--page,#FFFFFF);stroke:var(--edge,#8F8F8F);stroke-dasharray:4 3;}
  .node.sel rect{stroke:var(--ink,#171717);stroke-width:3;}
  /* dimmed: a neutral fill and ink-2 labels, never low opacity, so labels keep their contrast */
  .node.dim rect{fill:var(--surface-2,#F2F2F2);stroke:var(--line,#EBEBEB);}
  /* Node symbols live in an HTML overlay synced to the SVG viewBox
     (foreignObject positions unreliably under viewBox transforms in WebKit). */
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  #labelsInner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .nlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;pointer-events:none;}
  .nlab.obs{color:#FFFFFF;} .nlab.hid{color:var(--ink,#171717);} .nlab.param{color:var(--ink-2,#4D4D4D);}
  .nlab.dim{color:var(--ink-2,#4D4D4D);}
  .nlab code,#measure code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:14px;}
  #measure{position:absolute;left:-9999px;top:-9999px;font-size:22px;visibility:hidden;}

  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .g{color:var(--ink,#171717);font-weight:500;}
  .legend .sep{width:1px;height:16px;background:var(--line,#EBEBEB);}
  .legend .ver{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .sw.obs{background:var(--data-obs,#4F46E5);}
  .sw.hid{background:var(--surface-2,#F2F2F2);box-shadow:inset 0 0 0 1px var(--edge,#8F8F8F);}
  .sw.param{background:var(--page,#FFFFFF);border:1px dashed var(--edge,#8F8F8F);}
  @media (max-width:960px){.legend{display:none;}}
  /* the provenance panel floats top right; below 961 px it is a bottom sheet */
  .om-panel{position:absolute;top:16px;right:16px;z-index:5;width:360px;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;padding:20px;border:0;border-radius:12px;background:var(--page,#FFFFFF);box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));display:none;}
  @media (max-width:960px){.om-panel{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:55%;border-radius:12px 12px 0 0;}}
  .om-panel .x{float:right;width:32px;height:32px;margin:-8px -8px 0 8px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:var(--radius,6px);background:transparent;color:var(--ink,#171717);font:inherit;font-size:20px;line-height:1;cursor:pointer;}
  .om-panel .x:hover{background:var(--surface-2,#F2F2F2);}
  .om-panel-label{margin:16px 0 8px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2,#4D4D4D);}

  .om-panel .badge,.om-panel .tiertag{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-left:8px;border-radius:9999px;background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-family:var(--font-sans,"Geist",ui-sans-serif,system-ui,sans-serif);font-size:12px;font-weight:500;vertical-align:middle;}
  .om-panel .tiertag{color:var(--ink-2,#4D4D4D);}
  .om-panel .name{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);color:var(--ink-2,#4D4D4D);font-size:13px;margin:8px 0 0;overflow-wrap:anywhere;}
  .om-panel .uid{margin-top:4px;font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:12px;line-height:16px;color:var(--ink-2,#4D4D4D);overflow-wrap:anywhere;}
  .formula{background:var(--surface,#FAFAFA);border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);padding:12px;overflow-x:auto;}
  .formula code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px;color:var(--ink,#171717);white-space:pre-wrap;overflow-wrap:anywhere;}
  .fop{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:12px;color:var(--ink-2,#4D4D4D);margin:10px 0 4px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font:inherit;font-size:18px;border:0;box-shadow:0 0 0 1px var(--line,#EBEBEB);background:var(--page,#FFFFFF);border-radius:var(--radius,6px);padding:4px 10px;color:var(--ink,#171717);cursor:pointer;transition:background-color var(--dur,150ms) var(--ease,ease);}
  .chip:hover{background:var(--surface-2,#F2F2F2);}
  .chip code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px;}
  .om-panel .mapby .om-kv-k{font-weight:500;color:var(--ink,#171717);}
  .om-panel .mapby .om-kv-v{font-size:12px;max-width:190px;}
  .lean-line{margin:4px 0 2px;padding:8px 10px;border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);background:var(--page,#FFFFFF);color:var(--ink,#171717);font:400 12px/16px var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);white-space:pre-wrap;overflow-wrap:anywhere;}
  .lean-badge{color:var(--data-sim,#0C7C55);}
  .muted{color:var(--ink-2,#4D4D4D);}
  /* edge formula tip */
  #tip{position:fixed;z-index:30;max-width:420px;padding:8px 10px;border-radius:var(--radius,6px);background:var(--ink,#171717);color:var(--page,#FFFFFF);font-size:13px;line-height:18px;box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));pointer-events:none;display:none;}
  #tip .op{font-size:12px;font-weight:500;margin-bottom:4px;}
  #tip .fx{overflow-x:auto;}
  #tip .fx code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:12px;white-space:pre-wrap;}
  /* status notices */
  #banner{flex:none;margin:8px var(--inset,16px) 0;display:none;}
  #err{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;display:none;white-space:pre-wrap;}
  /* static outline, shown only when the layout library is missing */
  #fallback{flex:1 1 auto;min-height:0;overflow:auto;padding:24px var(--inset,16px) 48px;display:none;}
  #fallback .ft{font-size:20px;line-height:28px;font-weight:450;color:var(--ink,#171717);margin:24px 0 4px;}
  #fallback .fd{color:var(--ink-2,#4D4D4D);margin-bottom:12px;}
  #fallback .fn{border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);padding:12px 16px;margin:8px 0;background:var(--surface,#FAFAFA);}
  #fallback .fn .fs{font-weight:500;color:var(--ink,#171717);}
  #fallback .fn .fs code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);}
  #fallback .fn .fk{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-left:8px;border-radius:9999px;background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-size:12px;font-weight:500;vertical-align:middle;}
  #fallback .fn .fe{color:var(--ink-2,#4D4D4D);margin-top:6px;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important;}}

<script>
"use strict";
// ============================================================================
//  openmaterials map: layered physics-tier pipeline.
//  Sections in reading order:
//    - shared    : DOM handles, small helpers (tex fallback, esc), the view box
//    - data      : fetch graph/codes, build adjacency
//    - layout    : dagre for vertical order, tier-band x-override for columns
//    - render    : bands, nodes (structure only)
//    - interaction: pan/zoom, depth levels, provenance panel, code filter, search, keys
//    - fallback  : static readable outline when dagre is missing
//  KaTeX and dagre both degrade: no code path throws when either is undefined.
// ============================================================================

// ---- shared ----------------------------------------------------------------
const svg=document.getElementById('svg'), vp=document.getElementById('vp'),
      bandsG=document.getElementById('bands'), measure=document.getElementById('measure'),
      tip=document.getElementById('tip'), panelEl=document.getElementById('panel'),
      codeFilter=document.getElementById('codeFilter'), tierJump=document.getElementById('tierJump');
const HAS_KATEX = (typeof katex!=='undefined');
const HAS_DAGRE = (typeof dagre!=='undefined');

let VB={x:0,y:0,w:1000,h:1000}, GW=1000, GH=1000;
// Node labels are LABEL_UNITS tall; no view scales them under 12 px.
const LABEL_UNITS=22, MIN_SCALE=12/LABEL_UNITS, DEFAULT_SCALE=0.75;   // 16.5 px labels at rest
let BANDS_TOP=0, lastFocus=null, lastAnchor=null, lastHits=[];
let leanData={nodes:{},edges:{}};
let nodeById={}, parents={}, children={}, symHtml={}, pos={},
    codesData={}, activeCode=null, tierList=[], tierIndex={}, edgeList=[],
    depth='overview';   // 'overview' | 'expanded' | 'focused'

function err(m){ const e=document.getElementById('err'); e.style.display='block'; e.textContent='Error: '+m; }
function banner(m){ const b=document.getElementById('banner'); b.style.display='block'; b.textContent=m; }
function scaleOf(){ const r=svg.getBoundingClientRect(); return Math.min(r.width/VB.w, r.height/VB.h); }
// Above 1, a view box is larger than the 12 px label floor allows.
function overFloor(vb){ const r=svg.getBoundingClientRect(); return r.width&&r.height ? Math.max(vb.w*MIN_SCALE/r.width, vb.h*MIN_SCALE/r.height) : 0; }
function setVB(){
  const k=overFloor(VB);
  if(k>1){ const cx=VB.x+VB.w/2, cy=VB.y+VB.h/2; VB.w/=k; VB.h/=k; VB.x=cx-VB.w/2; VB.y=cy-VB.h/2; }
  svg.setAttribute('viewBox', VB.x+' '+VB.y+' '+VB.w+' '+VB.h);
  svg.classList.toggle('far', 16*scaleOf()<11.99);   // 16-unit band text hides below 12 px (11.99 absorbs rounding)
  syncLabels();
}
// A zoom-out factor capped at the floor, for zooms anchored off center (wheel, pinch).
function capOut(f, vb){ const k=overFloor(vb); return f>1 && k ? Math.min(f, 1/k) : f; }
// The landing view: tier columns from `band` (0, the first) at the left edge, labels at 16.5 px.
function fitDefault(band){ const r=svg.getBoundingClientRect(); VB={x:(band||0)*(BAND_W+BAND_GAP)-24, y:BANDS_TOP-24, w:(r.width||1000)/DEFAULT_SCALE, h:(r.height||1000)/DEFAULT_SCALE}; setVB(); }
function zoomBy(f){ VB.x+=VB.w*(1-f)/2; VB.y+=VB.h*(1-f)/2; VB.w*=f; VB.h*=f; setVB(); }
// Mirror the viewBox transform onto the HTML label layer
// (preserveAspectRatio="xMidYMid meet" semantics, computed by hand).
function syncLabels(){
  const inner=document.getElementById('labelsInner'); if(!inner) return;
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height||!VB.w||!VB.h) return;
  const sc=Math.min(r.width/VB.w, r.height/VB.h);
  const tx=(r.width-VB.w*sc)/2 - VB.x*sc;

// Render LaTeX with KaTeX; on any failure fall back to the raw string.

// ---- data ------------------------------------------------------------------
// The map is the VIEW of the structure MODEL: nodes, edges, formulas, and the
// code representations that map onto them. Values, instances, and spectra are a
// separate evidence layer that consumers load against node uids; the map page
// never fetches or renders them (see the paper's MVC statement).
Promise.all([
  fetch('../data/graph.json').then(r=>r.json()),
  fetch('../data/codes.json').then(r=>r.json()).catch(()=>({})),
  fetch('../data/version.json').then(r=>r.json()).catch(()=>null),

  fetch('../data/lean.json').then(r=>r.json()).catch(()=>({nodes:{},edges:{}}))

// The semantic index: a node/edge's surface labels (auto + curated), keyed by
// id. Labels are structure metadata over uids, not evidence, so the map view
// stays MVC-pure. resolveLabel() mirrors omai/semantics.resolve: normalize,
// exact-alias, token-containment; deterministic, no server call.
let semById={};
function normLabel(s){ return String(s).replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[-_]/g,' ').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }

  const nq=normLabel(q), qt=tokset(q); if(!nq) return [];
  const out=[];
  for(const id in semById){
    const e=semById[id]; let score=0;
    if((e.curated||[]).some(c=> normLabel(c)===nq)) score=1.0;
    else if((e.labels||[]).some(l=> normLabel(l)===nq)) score=0.9;
    // token containment: 0.6 plus a coverage bonus, rounded as omai/semantics.py rounds it
    else if(qt.size){ const es=tokset((e.labels||[]).join(' ')+' '+id); let all=true; qt.forEach(t=>{ if(!es.has(t)) all=false; }); if(all) score=Math.round((0.6+Math.min(0.2,0.2*qt.size/Math.max(1,tokset(id).size)))*1000)/1000; }
    if(score) out.push({id, kind:e.kind, score});
  }
  return out.sort((a,b)=> b.score-a.score || a.id.localeCompare(b.id));

function build([graph, codes, version, semantics, lean]){
  leanData = lean || {nodes:{},edges:{}};
  (semantics||[]).forEach(e=>{ semById[e.id]=e; });
  codesData = codes || {};
  if(version && version.version){
    const vh=document.getElementById('mapverhash');
    vh.textContent=(''+version.version).slice(0,12);
    document.getElementById('mapver').style.display='';
    document.getElementById('versep').style.display='';
  }
  graph.nodes.forEach(n=>{ nodeById[n.id]=n; symHtml[n.id]=tex(n.symbol); });

  const seen=new Set();
  graph.links.forEach(l=>{ const k=l.source+'>>'+l.target;
    if(!seen.has(k) && l.source!==l.target && nodeById[l.source] && nodeById[l.target]){
      seen.add(k); edgeList.push(l);
      (children[l.source]=children[l.source]||[]).push(l.target);
      (parents[l.target]=parents[l.target]||[]).push(l.source);
    }
  });

  tierList = (graph.tiers||[]).slice().sort((a,b)=> a.order-b.order);
  tierList.forEach((t,i)=>{ tierIndex[t.name]=i; });
  let needsOther=false;
  graph.nodes.forEach(n=>{ if(!(n.tier in tierIndex)) needsOther=true; });
  if(needsOther){ tierList.push({name:'Other', order:1e6, description:'Nodes without an assigned tier.'}); tierIndex['Other']=tierList.length-1; }
  function bandOf(n){ return (n.tier in tierIndex) ? tierIndex[n.tier] : tierIndex['Other']; }

  graph.nodes.forEach(n=>{ measure.innerHTML=symHtml[n.id]||''; n._w=Math.max(56, measure.offsetWidth+30); n._h=Math.max(44, measure.offsetHeight+20); });

  // both selects are filled before the hash is applied, so a #code= link shows its code
  renderCodeBar();
  tierList.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=t.name; tierJump.appendChild(o); });

  if(HAS_DAGRE) layoutAndRender(graph, bandOf);
  else renderFallback(graph, bandOf);
}

// ---- layout ----------------------------------------------------------------
const BAND_W=360, BAND_GAP=54, BAND_PADX=26, HEAD_H=118, HEAD_SPACE=160, NODE_GAP=22;
function layoutAndRender(graph, bandOf){
  const g=new dagre.graphlib.Graph();
  g.setGraph({rankdir:'LR', nodesep:NODE_GAP, ranksep:120, marginx:24, marginy:HEAD_H});
  g.setDefaultEdgeLabel(()=>({}));
  graph.nodes.forEach(n=> g.setNode(n.id,{width:n._w,height:n._h}));
  edgeList.filter(e=> e.kind!=='param').forEach(e=> g.setEdge(e.source,e.target));
  dagre.layout(g);

  const bandOfNodes={};
  graph.nodes.forEach(n=>{ const b=bandOf(n); (bandOfNodes[b]=bandOfNodes[b]||[]).push(n); });
  Object.keys(bandOfNodes).forEach(bi=>{
    const list=bandOfNodes[bi];
    const xs=[...new Set(list.map(n=> Math.round(g.node(n.id).x)))].sort((a,b)=>a-b);
    const nCol=xs.length, usable=BAND_W-2*BAND_PADX;
    list.forEach(n=>{
      const gn=g.node(n.id);
      const ci=xs.indexOf(Math.round(gn.x));
      const localX = nCol<=1 ? BAND_W/2 : (BAND_PADX + n._w/2 + (usable-n._w)*(ci/(nCol-1)));
      const bx = (+bi)*(BAND_W+BAND_GAP) + localX;
      pos[n.id]={x:bx, y:gn.y, w:gn.width, h:gn.height, band:+bi, col:ci};
    });
    // Pack the column from the top in dagre's vertical order: dagre spreads each
    // rank over the whole graph height, which started some columns 1000+ units down.
    let y=HEAD_H;
    list.slice().sort((a,b)=> pos[a.id].y-pos[b.id].y).forEach(n=>{ const p=pos[n.id]; p.y=y+p.h/2; y+=p.h+NODE_GAP; });
  });
  graph.nodes.forEach(n=>{ if(!pos[n.id]){ const b=bandOf(n); pos[n.id]={x:b*(BAND_W+BAND_GAP)+BAND_W/2, y:HEAD_H+40, w:n._w, h:n._h, band:b, col:0}; } });

  let minY=1e9, maxY=-1e9;
  graph.nodes.forEach(n=>{ const p=pos[n.id]; minY=Math.min(minY,p.y-p.h/2); maxY=Math.max(maxY,p.y+p.h/2); });
  GW = tierList.length*(BAND_W+BAND_GAP);
  GH = Math.max(maxY+60, HEAD_H+200);

  renderBands(minY, maxY);
  renderGraph(graph);
  fitDefault();
  applyDepth();
  applyHash();
}

// ---- render ----------------------------------------------------------------
function renderBands(minY, maxY){

    if(i>0) s+='<line class="bl" x1="'+(x-BAND_GAP/2)+'" y1="'+top+'" x2="'+(x-BAND_GAP/2)+'" y2="'+bottom+'"></line>';
    s+='<text class="ord" x="'+(x+BAND_PADX)+'" y="'+(top+34)+'" font-size="16">'+(t.order===1e6?'*':(t.order+1).toString().padStart(2,'0'))+'</text>';
    s+='<text class="h" x="'+(x+BAND_PADX)+'" y="'+(top+66)+'" font-size="24">'+esc(t.name)+'</text>';

function wrapText(str, x, y, maxW, size, cls, maxLines){

  words.forEach(w=>{ const test=cur?cur+' '+w:w; if(test.length>cpl && cur){ lines.push(cur); cur=w; } else cur=test; });

// ---- interaction: touch (pan / pinch / tap) --------------------------------

  let h=closeBtn()+'<div class="om-panel-label">Operator</div><div class="name" style="font-family:inherit;font-weight:500;color:var(--ink,#171717);font-size:16px">'+esc(opName(op))+'</div>';
  h+='<div class="sym" style="margin-top:8px">'+tex(sn.symbol)+' <span class="muted">&rarr;</span> '+tex(tn.symbol)+'</div>';
  const f=edgeFormula(tn, op);
  h+='<div class="om-panel-label">Computes</div><div class="formula">'+(f?tex(f,true):'<span class="muted">Input quantity: no edge produces it.</span>')+'</div>';
  panelEl.innerHTML=h; panelEl.style.display='block';
}

// ---- deep links: #node=<id> selects and frames a quantity -------------------
function nodeFromHash(){ const m=location.hash.match(/[#?&]node=([^&]*)/); return m?decodeURIComponent(m[1]):null; }
function codeFromHash(){ const m=location.hash.match(/[#?&]code=([^&]*)/); return m?decodeURIComponent(m[1]):null; }
function syncHash(id){
  const h=id?('#node='+encodeURIComponent(id)):'';
  if(location.hash===h||(!h&&!location.hash)) return;
  history.replaceState(null,'',h||location.pathname+location.search);
}
function expFromHash(){ const m=location.hash.match(/[#?&]experiment=([^&]*)/); return m?decodeURIComponent(m[1]):null; }
let instancesPromise=null;
function loadInstances(){
  if(!instancesPromise){ instancesPromise=fetch('../data/instances.json').then(r=>r.json()).catch(()=>[]); }
  return instancesPromise;
}
function resolveNodeId(v){ if(nodeById[v]) return v; const b=(''+v).split('[')[0]; return nodeById[b]?b:null; }
function showExperiment(ref, recs){
  const mine=recs.filter(r=> r.source && r.source.ref===ref);
  const ids=[...new Set(mine.map(r=>resolveNodeId(r.variable)).filter(Boolean))];
  let h=closeBtn()+'<div class="om-panel-label">Experiment</div>';
  h+='<div class="name" style="font-weight:500;color:var(--ink,#171717)">'+esc(ref)+'</div>';
  if(!ids.length){
    h+='<p>No committed value in this site build carries this source reference.</p>';
    panelEl.innerHTML=h; panelEl.style.display='block'; return;
  }
  depth='focused'; clearDim();
  const keep=new Set(ids);
  vp.querySelectorAll('.node').forEach(el=>{ el.classList.toggle('dim', !keep.has(el.dataset.id)); el.classList.toggle('sel', keep.has(el.dataset.id)); });
  vp.querySelectorAll('.edge').forEach(el=>{ const ab=el.dataset.edge.split('>>'); const inc=keep.has(ab[0])&&keep.has(ab[1]); el.classList.toggle('dim', !inc); el.classList.toggle('hot', inc); });
  h+='<div class="om-panel-label">'+mine.length+' value'+(mine.length>1?'s':'')+' on '+ids.length+' quantit'+(ids.length>1?'ies':'y')+', marked on the map</div>';
  h+='<div class="chips">'+ids.map(chip).join('')+'</div>';
  h+='<p><a href="../experiment/#ref='+encodeURIComponent(ref)+'">Open the experiment page</a></p>';
  panelEl.innerHTML=h; panelEl.style.display='block';
  fitTo(ids, ids[0]);
}
function applyHash(){
  const ref=expFromHash();
  if(ref){ loadInstances().then(recs=>showExperiment(ref,recs)); return; }
  // #code=<name>: land with one code's rails lit (the codes bibliography links here)
  const codeRef=codeFromHash();
  if(codeRef && codesData[codeRef]){ if(activeCode!==codeRef) toggleCode(codeRef); return; }
  if(activeCode) toggleCode(activeCode); // the hash no longer names a code: clear the filter
  let id=nodeFromHash(); if(!id) return;
  if(!nodeById[id]){ const b=id.split('[')[0]; if(!nodeById[b]) return; id=b; }
  selectNode(nodeById[id]);
  fitTo(neighborhood(id), id);
}
window.addEventListener('hashchange', applyHash);
document.getElementById('copylink').addEventListener('click', function(){
  const btn=this, url=location.href;
  const done=function(){ btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy link'; },1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ window.prompt('Copy this link:',url); }); }
  else{ window.prompt('Copy this link:',url); }
});

// The view switch carries the selection: the current #node= rides along to the other view.
document.querySelector('.view-switch').addEventListener('click', e=>{
  const a=e.target.closest('a'), m=location.hash.match(/[#?&]node=([^&]*)/);
  if(a&&m) a.hash='node='+m[1];
});

// click routing
svg.addEventListener('click', e=>{ if(moved)return;
  const nd=e.target.closest('.node'); if(nd){ selectNode(nodeById[nd.dataset.id]); return; }
  const ed=e.target.closest('.edge'); if(ed){ selectEdge(ed.dataset.edge, ed.dataset.op); return; }
  clearSel();
});
// a focused node opens with Enter or Space, framed with its neighbors
svg.addEventListener('keydown', e=>{
  const nd=(e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.node'); if(!nd) return;
  e.preventDefault(); const id=nd.dataset.id; selectNode(nodeById[id]); fitTo(neighborhood(id), id);
});

// ---- interaction: edge formula hover ---------------------------------------
svg.addEventListener('mousemove', e=>{ const ed=e.target.closest('.edge'); if(!ed){ tip.style.display='none'; return; }
  const [s,t]=ed.dataset.edge.split('>>'); const tn=nodeById[t]; if(!tn) return;
  const f=edgeFormula(tn, ed.dataset.op);
  const body = f ? tex(f) : '<span>Input quantity: no edge produces it.</span>';
  tip.innerHTML='<div class="op">'+esc(opName(ed.dataset.op))+'</div><div class="fx">'+body+'</div>';
  tip.style.display='block';
  let tx=e.clientX+16, ty=e.clientY+16;
  const r=tip.getBoundingClientRect();
  if(tx+r.width>window.innerWidth-8) tx=e.clientX-r.width-16;
  if(ty+r.height>window.innerHeight-8) ty=e.clientY-r.height-16;
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
svg.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });

// ---- interaction: code filter ----------------------------------------------
function codeCredit(code){ const sp=codesData[code]||{}; const any=Object.values(sp).find(e=>e && (e.citation||e.license)); if(!any) return ''; const cit=(any.citation||'').trim().replace(/\.$/,''); const lic=(any.license||'').trim(); return cit&&lic?(cit+'. License: '+lic+'.'):(cit||lic); }
function renderCodeBar(){ Object.keys(codesData).sort().forEach(code=>{ const o=document.createElement('option'); o.value=code; o.textContent=code+' ('+Object.keys(codesData[code]||{}).length+')'; const cr=codeCredit(code); if(cr) o.title=cr; codeFilter.appendChild(o); }); }
codeFilter.addEventListener('change', function(){ if(this.value) toggleCode(this.value); else if(activeCode) toggleCode(activeCode); });
function toggleCode(code){
  if(activeCode===code){ activeCode=null; codeFilter.value=''; depth='expanded'; applyDepth(); return; }
  activeCode=code; codeFilter.value=code;
  const set=new Set(Object.keys(codesData[code]||{}));
  depth='focused'; clearDim(); panelEl.style.display='none';
  vp.querySelectorAll('.node').forEach(el=> el.classList.toggle('dim', !set.has(el.dataset.id)));
  vp.querySelectorAll('.edge').forEach(el=>{ const ab=el.dataset.edge.split('>>'); el.classList.toggle('dim', !(set.has(ab[0])&&set.has(ab[1]))); });
  if(set.size) fitTo([...set]);
}

// ---- interaction: search ---------------------------------------------------
const qInput=document.getElementById('q'), mapStatus=document.getElementById('mapStatus');
qInput.addEventListener('input', function(){
  const v=this.value.trim(); if(!v){ lastHits=[]; mapStatus.textContent=''; clearSel(); return; }
  // Semantic resolution first: a physicist types "quasi-harmonic approximation"
  // or "kappa" and the map grounds it to the matching nodes AND the edges of
  // matched families. Falls back to the id/symbol substring match so partial
  // typing still narrows.
  const resolved=resolveLabel(v);
  let nodeHits, edgeOps;
  if(resolved.length){
    nodeHits=resolved.filter(r=> r.kind==='node').map(r=> r.id).filter(id=> nodeById[id]);
    edgeOps=new Set(resolved.filter(r=> r.kind==='edge').map(r=> r.id));
  } else {
    const lv=v.toLowerCase();
    nodeHits=Object.values(nodeById).filter(n=> (n.id+' '+(n.symbol||'')).toLowerCase().includes(lv)).map(n=>n.id);
    edgeOps=new Set();
  }
  const set=new Set(nodeHits); depth='focused'; clearDim(); panelEl.style.display='none';
  vp.querySelectorAll('.node').forEach(el=> el.classList.toggle('dim', !set.has(el.dataset.id)));
  // an edge lights if it produces/consumes a hit node, or its operator resolved
  vp.querySelectorAll('.edge').forEach(el=>{
    const ab=(el.dataset.edge||'').split('>>'); const opn=el.dataset.op||'';
    const touches=set.has(ab[0])||set.has(ab[1]); const named=edgeOps.has(opn);
    el.classList.toggle('dim', !(touches||named)); el.classList.toggle('hot', named);
  });
  lastHits=nodeHits;
  mapStatus.textContent=nodeHits.length+(nodeHits.length===1?' match':' matches');
  if(nodeHits.length) fitTo(nodeHits, nodeHits[0]);
});
// Enter opens the best hit, framed with its neighbors
qInput.addEventListener('keydown', e=>{
  if(e.key!=='Enter'||!lastHits.length) return;
  e.preventDefault(); const id=lastHits[0]; selectNode(nodeById[id]); fitTo(neighborhood(id), id);
});

// keyboard: Escape returns from focus/panel; outside a field, / searches,
// + and - zoom, 0 returns to the landing view, arrows pan by a tenth of the view.
const PAN={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if(panelEl.style.display==='block'||depth==='focused'){ clearSel(); } return; }
  const t=e.target;
  if(e.metaKey||e.ctrlKey||e.altKey||!(t instanceof Element)||/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)||t.isContentEditable||panelEl.contains(t)) return;
  if(e.key==='/'){ e.preventDefault(); qInput.focus(); }
  else if(e.key==='+'||e.key==='='){ zoomBy(0.8); }
  else if(e.key==='-'){ zoomBy(1.25); }
  else if(e.key==='0'){ fitDefault(); }
  else if(PAN[e.key]){ e.preventDefault(); VB.x+=PAN[e.key][0]*VB.w*0.1; VB.y+=PAN[e.key][1]*VB.h*0.1; setVB(); }
});

// ---- fallback: static readable outline (dagre missing) ---------------------
// Each tier heading + its nodes listed (symbol-or-name) with outgoing edges
// named by op, so the page communicates structure without a layout engine.
function renderFallback(graph, bandOf){
  banner('The layout library did not load, so the tiers are listed as text.');
  document.getElementById('cy').style.display='none';
  const fb=document.getElementById('fallback'); fb.style.display='block';
  const byBand={};
  graph.nodes.forEach(n=>{ const b=bandOf(n); (byBand[b]=byBand[b]||[]).push(n); });
  let s='';
  tierList.forEach((t,i)=>{
    const list=byBand[i]||[];
    s+='<div class="ft">'+esc(t.name)+'</div><div class="fd">'+esc(t.description||'')+'</div>';
    list.forEach(n=>{
      const outs=(children[n.id]||[]);
      s+='<div class="fn"><span class="fs">'+(symHtml[n.id]||'')+' '+esc(n.id)+'</span><span class="fk '+n.type+'">'+esc(n.type)+'</span>';
      if(outs.length){
        const edg=outs.map(t2=>{ const e=edgeList.find(x=> x.source===n.id && x.target===t2); return '<span>&rarr;</span> '+esc(t2)+(e&&e.op?(' ('+esc(opName(e.op))+')'):''); });
        s+='<div class="fe">'+edg.join('<br>')+'</div>';
      }
      s+='</div>';
    });
  });
  fb.innerHTML=s;
}
</script>
