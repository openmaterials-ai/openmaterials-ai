<style>
  /* The tracer, an app page: header, toolbar, a full-bleed canvas with the
     panel, path bar and legend floating over it. The tracing classes
     (.up/.down/.dest/.sel) are the behavior; colors are the site.css tokens,
     each var() with the light value as its fallback.
       up   = ink (what it is built from); amber stays for measurements
       down = observable indigo (what it feeds)
       dest = indigo outline (a terminal observable, at rest)
       sel  = solid ink */
  @layer om-fallback {
    /* Shared components. Unlayered site.css rules win over these once it defines them. */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:9999px;font:inherit;font-weight:500;font-size:16px;line-height:24px;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color var(--dur,150ms) var(--ease,ease),color var(--dur,150ms) var(--ease,ease);}
    .btn--sm{height:32px;padding:0 12px;border-radius:var(--radius,6px);font-size:14px;line-height:20px;}
    .btn--secondary{background:var(--page,#FFFFFF);color:var(--ink,#171717);box-shadow:0 0 0 1px var(--line,#EBEBEB);}
    .btn--ghost{background:transparent;color:var(--ink,#171717);}
    .btn--secondary:hover,.btn--ghost:hover{background:var(--surface-2,#F2F2F2);}
    .view-switch{display:inline-flex;gap:2px;height:32px;padding:2px;border-radius:var(--radius,6px);box-shadow:0 0 0 1px var(--line,#EBEBEB);}
    .view-switch a{display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;font-weight:500;font-size:14px;line-height:20px;color:var(--ink-2,#4D4D4D);text-decoration:none;}
    .view-switch a:hover{color:var(--ink,#171717);}
    .view-switch a[aria-current="page"]{color:var(--ink,#171717);background:var(--surface-2,#F2F2F2);}
    .notice{padding:12px 16px;border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);background:var(--surface,#FAFAFA);font-size:14px;line-height:20px;color:var(--ink,#171717);}
    .notice--error{border-color:var(--ink,#171717);}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
    .hint{display:flex;gap:12px;align-items:center;color:var(--ink-2,#4D4D4D);white-space:nowrap;}
    kbd{font:400 12px/16px var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);padding:1px 4px;border-radius:4px;box-shadow:0 0 0 1px var(--line,#EBEBEB);color:var(--ink,#171717);}
    @media (max-width:960px){.hint{display:none;}}
  }
  *{box-sizing:border-box;}
  body.app{height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page,#FFFFFF);color:var(--ink,#171717);font:400 14px/20px var(--font-sans,"Geist","Geist Fallback",ui-sans-serif,system-ui,sans-serif);-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:2px solid var(--ink,#171717);outline-offset:2px;}
  /* toolbar */
  .toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px var(--inset,16px);border-bottom:1px solid var(--line,#EBEBEB);background:var(--page,#FFFFFF);}
  .toolbar .om-search{flex:1 1 200px;max-width:360px;min-width:0;}
  .toolbar .push{margin-left:auto;}
  @media (max-width:960px){.toolbar .om-search{flex:1 1 100%;max-width:none;}}
  @media (max-width:600px){#copylink{display:none;}}
  /* canvas */
  .canvas{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--canvas-dots,radial-gradient(circle at 1px 1px,var(--line,#EBEBEB) 1px,transparent 0) 0 0/24px 24px),var(--page,#FFFFFF);}
  #svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;} #svg.drag{cursor:grabbing;}
  /* edges: 1px base; lit upstream ink, downstream indigo; the rest fade while a trace is lit */
  .edge{fill:none;stroke:var(--edge,#8F8F8F);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;transition:stroke var(--dur,150ms) var(--ease,ease),opacity var(--dur,150ms) var(--ease,ease);}
  .edge.up{stroke:var(--ink,#171717);stroke-width:2;}
  .edge.down{stroke:var(--data-obs-line,#4F46E5);stroke-width:2;}
  #vp.lit .edge:not(.up):not(.down){opacity:.15;}
  /* nodes */
  .node{cursor:pointer;}
  .node:focus{outline:none;} .node:focus-visible{outline:2px solid var(--ink,#171717);outline-offset:2px;}
  .node rect{fill:var(--surface-2,#F2F2F2);stroke:var(--edge,#8F8F8F);stroke-width:1;vector-effect:non-scaling-stroke;transition:fill var(--dur,150ms) var(--ease,ease),stroke var(--dur,150ms) var(--ease,ease);}
  /* Symbols live in an HTML overlay synced to the viewBox (foreignObject
     mis-positions under viewBox transforms in WebKit). */
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  #labelsInner{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .nlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--ink,#171717);pointer-events:none;}
  .node.dest rect{fill:var(--page,#FFFFFF);stroke:var(--data-obs-line,#4F46E5);stroke-width:2;} .nlab.dest{color:var(--data-obs-line,#4F46E5);}
  .node.up rect{fill:var(--page,#FFFFFF);stroke:var(--ink,#171717);stroke-width:2;} .nlab.up{color:var(--ink,#171717);}
  .node.down rect{fill:var(--data-obs,#4F46E5);stroke:var(--data-obs,#4F46E5);stroke-width:2;} .nlab.down{color:#FFFFFF;}
  .node.sel rect{fill:var(--ink,#171717);stroke:var(--ink,#171717);stroke-width:3;} .nlab.sel{color:var(--page,#FFFFFF);}   /* the traced node, solid ink */
  /* dimmed: a lighter fill and ink-2 labels, never low opacity, so labels keep their contrast */
  .node.dim rect{fill:var(--surface,#FAFAFA);stroke:var(--line,#EBEBEB);stroke-width:1;} .nlab.dim{color:var(--ink-2,#4D4D4D);}
  #measure{position:absolute;left:-9999px;top:-9999px;font-size:18px;visibility:hidden;}
  /* the derivation panel floats top right; below 961 px it is a bottom sheet */
  .om-panel{position:absolute;top:16px;right:16px;z-index:5;width:360px;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;padding:20px;border:0;border-radius:12px;background:var(--page,#FFFFFF);box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));display:none;}
  @media (max-width:960px){.om-panel{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:55%;border-radius:12px 12px 0 0;}}
  .om-panel .x{float:right;width:32px;height:32px;margin:-8px -8px 0 8px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:var(--radius,6px);background:transparent;color:var(--ink,#171717);font:inherit;font-size:20px;line-height:1;cursor:pointer;}
  .om-panel .x:hover{background:var(--surface-2,#F2F2F2);}
  .om-panel .sym{font-size:28px;color:var(--ink,#171717);}
  .om-panel .badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;margin-left:8px;border-radius:9999px;background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-size:12px;font-weight:500;vertical-align:middle;}
  .om-panel .name{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);color:var(--ink-2,#4D4D4D);font-size:13px;margin:8px 0 4px;overflow-wrap:anywhere;}
  .lab{margin:16px 0 8px;display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2,#4D4D4D);}
  .lab .dot{width:8px;height:8px;border-radius:50%;}
  .lab .dot.u{background:var(--ink,#171717);} .lab .dot.d{background:var(--data-obs-line,#4F46E5);}
  .step{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line,#EBEBEB);}
  .step:first-of-type{border-top:none;}
  .step .n{flex:0 0 24px;height:24px;margin-top:2px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius,6px);background:var(--surface-2,#F2F2F2);color:var(--ink-2,#4D4D4D);font:400 12px/16px var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);}
  .step .body{flex:1;min-width:0;}
  .step .rel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;color:var(--ink,#171717);}
  .step .op{padding:2px 8px;border-radius:var(--radius,6px);background:var(--surface-2,#F2F2F2);color:var(--ink-2,#4D4D4D);font:400 12px/16px var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);overflow-wrap:anywhere;}
  .step .fx{margin-top:6px;color:var(--ink-2,#4D4D4D);overflow-x:auto;}
  .arrow{color:var(--ink-2,#4D4D4D);}
  .empty{color:var(--ink-2,#4D4D4D);padding:4px 0;}
  .summary{margin-top:4px;padding:10px 12px;border:1px solid var(--line,#EBEBEB);border-radius:var(--radius,6px);background:var(--surface,#FAFAFA);color:var(--ink,#171717);}
  /* the path bar: a notice at the canvas top */
  .pathbar{position:absolute;top:16px;left:16px;z-index:6;max-width:calc(100% - 32px);display:none;align-items:center;flex-wrap:wrap;gap:8px;}
  @media (min-width:961px){.pathbar{max-width:calc(100% - 408px);}}
  .pathbar .ep{display:inline-block;padding:2px 8px;border-radius:var(--radius,6px);background:var(--surface-2,#F2F2F2);color:var(--ink,#171717);font-size:16px;}
  .pathbar .clear{height:28px;padding:0 10px;border:0;border-radius:var(--radius,6px);background:transparent;color:var(--ink,#171717);box-shadow:0 0 0 1px var(--line,#EBEBEB);font:inherit;font-weight:500;cursor:pointer;}
  .pathbar .clear:hover{background:var(--surface-2,#F2F2F2);}
  /* the caption shown after Reset */
  .rest-hint{position:absolute;left:16px;top:16px;z-index:2;max-width:min(560px,calc(100% - 32px));margin:0;color:var(--ink-2,#4D4D4D);pointer-events:none;}
  /* legend, floating over the canvas */
  .legend{position:absolute;left:16px;bottom:16px;z-index:4;display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:var(--radius,6px);background:var(--page,#FFFFFF);box-shadow:var(--shadow-float,0 0 0 1px #EBEBEB,0 4px 8px -4px rgb(0 0 0 / .04),0 16px 24px -8px rgb(0 0 0 / .06));font-size:12px;line-height:16px;color:var(--ink-2,#4D4D4D);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .sw.up{background:var(--page,#FFFFFF);box-shadow:inset 0 0 0 2px var(--ink,#171717);} .sw.down{background:var(--data-obs,#4F46E5);}
  .sw.obs{background:var(--page,#FFFFFF);box-shadow:inset 0 0 0 2px var(--data-obs-line,#4F46E5);}
  @media (max-width:960px){.legend{display:none;}}
  #err{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;display:none;white-space:pre-wrap;}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important;}}
</style>
</head>

  <defs>

    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--data-obs-line,#4F46E5)"></path></marker>
  </defs>

<script src="../assets/vendor/dagre.min.js"></script>
<script src="../assets/vendor/katex/dist/katex.min.js"></script>
<script>
const svg=document.getElementById('svg'), vp=document.getElementById('vp'), measure=document.getElementById('measure');
let VB={x:0,y:0,w:1000,h:1000}, GW=1000, GH=1000;
let nodeById={}, parents={}, children={}, pos={}, symHtml={}, opByEdge={};
// Labels are LABEL_UNITS tall; no view scales them under 12 px.
const LABEL_UNITS=18, MIN_SCALE=12/LABEL_UNITS;
const DEFAULT_NODE='ThermalConductivity[bte_solver=direct_inverse]';   // the Ge datum on the home page
let lastFocus=null, lastAnchor=null, lastHits=[];
// Above 1, a view box is larger than the 12 px label floor allows.
function overFloor(vb){ const r=svg.getBoundingClientRect(); return r.width&&r.height ? Math.max(vb.w*MIN_SCALE/r.width, vb.h*MIN_SCALE/r.height) : 0; }
function setVB(){
  const k=overFloor(VB);
  if(k>1){ const cx=VB.x+VB.w/2, cy=VB.y+VB.h/2; VB.w/=k; VB.h/=k; VB.x=cx-VB.w/2; VB.y=cy-VB.h/2; }
  svg.setAttribute('viewBox', VB.x+' '+VB.y+' '+VB.w+' '+VB.h); syncLabels();
}
// A zoom-out factor capped at the floor, for zooms anchored off center (wheel, pinch).
function capOut(f, vb){ const k=overFloor(vb); return f>1 && k ? Math.min(f, 1/k) : f; }
function syncLabels(){
  const inner=document.getElementById('labelsInner'); if(!inner) return;
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height||!VB.w||!VB.h) return;
  const sc=Math.min(r.width/VB.w, r.height/VB.h);
  inner.style.transform='translate('+((r.width-VB.w*sc)/2-VB.x*sc)+'px,'+((r.height-VB.h*sc)/2-VB.y*sc)+'px) scale('+sc+')';
}
window.addEventListener('resize', setVB);
let labelById={};
function tex(latex,display){ try{ return katex.renderToString(latex,{throwOnError:false,displayMode:!!display}); }catch(e){ return '<code>'+latex+'</code>'; } }
function smooth(pts){ if(!pts||pts.length<2) return ''; if(pts.length===2) return 'M'+pts[0].x+' '+pts[0].y+' L'+pts[1].x+' '+pts[1].y; let d='M'+pts[0].x+' '+pts[0].y; for(let i=1;i<pts.length-1;i++){ const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2; d+=' Q'+pts[i].x+' '+pts[i].y+' '+mx+' '+my; } d+=' L'+pts[pts.length-1].x+' '+pts[pts.length-1].y; return d; }
function err(m){ var e=document.getElementById('err'); e.style.display='block'; e.textContent='Error: '+m; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
// the rest caption and the toolbar hint say the same thing, so only one shows
function showRest(on){ document.getElementById('resthint').hidden=!on; document.querySelector('.toolbar .hint').style.display=on?'none':''; }

if(typeof dagre==='undefined'){ err('The layout library did not load. Check the connection and reload.'); }
else fetch('../data/graph.json').then(r=>r.json())
  .then(build).catch(e=> err('The map data did not load: '+e));

function build(graph){
  graph.nodes.forEach(n=>{ nodeById[n.id]=n; symHtml[n.id]=tex(n.symbol); });
  const seen=new Set(), edges=[];
  graph.links.forEach(l=>{ const k=l.source+'>>'+l.target; if(!seen.has(k)&&l.source!==l.target){ seen.add(k); edges.push(l); opByEdge[k]=l.op||''; (children[l.source]=children[l.source]||[]).push(l.target); (parents[l.target]=parents[l.target]||[]).push(l.source); } });

  graph.nodes.forEach(n=>{ measure.innerHTML=symHtml[n.id]; n._w=Math.max(46, measure.offsetWidth+24); n._h=Math.max(36, measure.offsetHeight+16); });
  const g=new dagre.graphlib.Graph(); g.setGraph({rankdir:'TB',nodesep:16,ranksep:104,marginx:30,marginy:34}); g.setDefaultEdgeLabel(()=>({}));
  graph.nodes.forEach(n=> g.setNode(n.id,{width:n._w,height:n._h}));
  edges.forEach(e=> g.setEdge(e.source,e.target));
  dagre.layout(g);
  GW=g.graph().width; GH=g.graph().height;

  let s='', lhtml='';
  edges.forEach(e=>{ const ed=g.edge({v:e.source,w:e.target}); if(!ed)return; s+='<path class="edge" data-edge="'+e.source+'>>'+e.target+'" d="'+smooth(ed.points)+'"></path>'; });
  graph.nodes.forEach(n=>{ const p=g.node(n.id); pos[n.id]={x:p.x,y:p.y,w:p.width,h:p.height}; const x=p.x-p.width/2, y=p.y-p.height/2; const dest=(n.type==='observable' && (children[n.id]||[]).length===0)?' dest':'';
    s+='<g class="node'+dest+'" data-id="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.id)+'"><rect x="'+x+'" y="'+y+'" width="'+p.width+'" height="'+p.height+'" rx="8"></rect></g>';
    lhtml+='<div class="nlab'+dest+'" data-id="'+esc(n.id)+'" style="left:'+x+'px;top:'+y+'px;width:'+p.width+'px;height:'+p.height+'px">'+symHtml[n.id]+'</div>'; });
  vp.innerHTML=s;
  const inner=document.getElementById('labelsInner');
  inner.innerHTML=lhtml;
  labelById={};
  inner.querySelectorAll('.nlab').forEach(l=>{ labelById[l.dataset.id]=l; });
  if(!window.__labelMirror){
    const MIRROR=['dim','up','down','sel'];
    window.__labelMirror=new MutationObserver(muts=>{
      muts.forEach(m=>{
        const el=m.target;
        if(!el.classList||!el.classList.contains('node')||!el.dataset.id) return;
        const lab=labelById[el.dataset.id]; if(!lab) return;
        MIRROR.forEach(c=> lab.classList.toggle(c, el.classList.contains(c)));
      });
    });
    window.__labelMirror.observe(vp,{attributes:true,subtree:true,attributeFilter:['class']});
  }
  syncLabels();
  fitAll();
  applyHash();
}
function fitAll(){ VB={x:0,y:0,w:GW,h:GH}; setVB(); }
// Frames ids; when the box is larger than the label floor allows, it centers on
// `anchor` (a node id) before setVB shrinks it, so the anchor stays in view.
function fitTo(ids, anchor){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; ids.forEach(id=>{const q=pos[id]; if(!q)return; x0=Math.min(x0,q.x-q.w/2); y0=Math.min(y0,q.y-q.h/2); x1=Math.max(x1,q.x+q.w/2); y1=Math.max(y1,q.y+q.h/2);}); if(x1<x0)return;
  lastFocus=ids; lastAnchor=anchor||null;
  const pad=120; VB={x:x0-pad,y:y0-pad,w:(x1-x0)+2*pad,h:(y1-y0)+2*pad};
  const a=anchor&&pos[anchor]; if(a&&overFloor(VB)>1){ VB.x=a.x-VB.w/2; VB.y=a.y-VB.h/2; }
  setVB(); }
document.getElementById('fitBtn').addEventListener('click', ()=>{ if(lastFocus) fitTo(lastFocus, lastAnchor); else fitAll(); });

// ---- graph reachability ----
function reach(id, adj){ const out=new Set(), dq=[id]; while(dq.length){ const x=dq.pop(); (adj[x]||[]).forEach(y=>{ if(!out.has(y)){ out.add(y); dq.push(y);} }); } return out; }
function pathBetween(a,b){ // directed a->...->b over children; fall back b->a
  function bfs(src,dst){ const prev={}, dq=[src], seen=new Set([src]); while(dq.length){ const x=dq.shift(); if(x===dst){ const p=[dst]; let c=dst; while(c!==src){ c=prev[c]; p.unshift(c);} return p; } (children[x]||[]).forEach(y=>{ if(!seen.has(y)){ seen.add(y); prev[y]=x; dq.push(y);} }); } return null; }
  return bfs(a,b) || (bfs(b,a)||[]).slice().reverse();
}

// ---- visual application ----
function clearClasses(){ vp.classList.remove('lit'); vp.querySelectorAll('.node').forEach(el=>el.classList.remove('dim','up','down','sel')); vp.querySelectorAll('.edge').forEach(el=>{el.classList.remove('up','down');el.removeAttribute('marker-end');}); }
function dimAllExcept(keep){ vp.classList.add('lit'); vp.querySelectorAll('.node').forEach(el=> el.classList.toggle('dim', !keep.has(el.dataset.id))); }
function paintEdge(s,t,kind){ const el=vp.querySelector('.edge[data-edge="'+cssesc(s+'>>'+t)+'"]'); if(el){ el.classList.add(kind); el.setAttribute('marker-end', kind==='up'?'url(#arrU)':'url(#arrD)'); } }
function cssesc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/["\\\]]/g,'\\$&'); }
function closeBtn(){ return '<button type="button" class="x" aria-label="Close" onclick="resetAll()">&times;</button>'; }
function clearBtn(label){ return '<button type="button" class="clear" onclick="resetAll()">'+label+'</button>'; }

function trace(id){
  showRest(false);
  syncHash('#node='+encodeURIComponent(id));
  pathMode=null; document.getElementById('pathbar').style.display='none';
  clearClasses();
  const anc=reach(id,parents), desc=reach(id,children);
  const keep=new Set([id, ...anc, ...desc]);
  dimAllExcept(keep);
  vp.querySelector('.node[data-id="'+cssesc(id)+'"]').classList.add('sel');
  anc.forEach(a=> vp.querySelector('.node[data-id="'+cssesc(a)+'"]')?.classList.add('up'));
  desc.forEach(d=> vp.querySelector('.node[data-id="'+cssesc(d)+'"]')?.classList.add('down'));
  // edges: upstream subgraph (both in anc∪id), downstream (both in desc∪id)
  const up=new Set([id,...anc]), dn=new Set([id,...desc]);
  Object.keys(opByEdge).forEach(k=>{ const [s,t]=k.split('>>'); if(up.has(s)&&up.has(t)) paintEdge(s,t,'up'); else if(dn.has(s)&&dn.has(t)) paintEdge(s,t,'down'); });
  derivationPanel(id, anc, desc);
  fitTo([...keep], id);
}

function stepHtml(s,t,i,kind){
  // the formula of the operator on this edge, not the node's first route
  const op=opByEdge[s+'>>'+t]||''; const n=nodeById[t]; const fe=n&&(n.formulas||[]).find(x=>x.op===op); const f=fe?fe.latex:(n&&n.formula);
  return '<div class="step"><div class="n">'+i+'</div><div class="body"><div class="rel">'+symHtml[s]+' <span class="arrow">&rarr;</span> '+symHtml[t]+(op?' <span class="op">'+esc(op)+'</span>':'')+'</div>'+(f?'<div class="fx">'+tex(f,false)+'</div>':'')+'</div></div>';
}
function orderedEdges(nodeSet){ // edges fully inside nodeSet, ordered by target layer
  const es=[]; Object.keys(opByEdge).forEach(k=>{ const [s,t]=k.split('>>'); if(nodeSet.has(s)&&nodeSet.has(t)) es.push([s,t]); });
  es.sort((a,b)=> (nodeById[a[1]].layer||0)-(nodeById[b[1]].layer||0)); return es;
}
function derivationPanel(id, anc, desc){
  const node=nodeById[id];
  const up=orderedEdges(new Set([id,...anc])), dn=orderedEdges(new Set([id,...desc]));
  const dests=[...desc].filter(d=> nodeById[d].type==='observable' && (children[d]||[]).length===0);
  let h=closeBtn();
  h+='<div><span class="sym">'+tex(node.symbol)+'</span><span class="badge '+node.type+'">'+node.type+'</span></div><div class="name">'+esc(node.id)+'</div>';
  const routes=(node.formulas||[]).length;
  h+='<div class="summary">'+(anc.size?('Built from '+anc.size+' upstream quantit'+(anc.size>1?'ies':'y')+(routes>1?' across '+routes+' routes':'')+'.'):'An input quantity.')+' '
    +(desc.size?('Feeds '+desc.size+' downstream quantit'+(desc.size>1?'ies':'y')+(dests.length?(', which end at '+dests.map(d=>tex(nodeById[d].symbol)).join(', ')):'')+'.'):'Nothing on the map uses it.')+'</div>';
  h+='<div class="lab"><span class="dot u"></span>Built from</div>';
  h+= up.length? up.map((e,i)=>stepHtml(e[0],e[1],i+1,'up')).join('') : '<div class="empty">Nothing upstream: this quantity is an input.</div>';
  h+='<div class="lab"><span class="dot d"></span>Feeds</div>';
  h+= dn.length? dn.map((e,i)=>stepHtml(e[0],e[1],i+1,'down')).join('') : '<div class="empty">Nothing downstream: no edge on the map uses this quantity.</div>';
  const p=document.getElementById('panel'); p.innerHTML=h; p.style.display='block';
}

// ---- deep links: #node=<id> traces a quantity; #from=&to= lights a path ----
function hashParam(k){ const m=location.hash.match(new RegExp('[#?&]'+k+'=([^&]*)')); return m?decodeURIComponent(m[1]):null; }
function syncHash(h){
  if(location.hash===h||(!h&&!location.hash)) return;
  history.replaceState(null,'',h||location.pathname+location.search);
}
// An empty hash traces the Ge datum, so the first view is a trace, not a blank prompt.
function applyHash(){
  const a=hashParam('from'), b=hashParam('to');
  if(a&&b&&nodeById[a]&&nodeById[b]){ finishPath(a,b); return; }
  const id=hashParam('node') || (location.hash ? null : DEFAULT_NODE);
  if(id&&nodeById[id]) trace(id); else showRest(true);
}
window.addEventListener('hashchange', applyHash);
document.getElementById('copylink').addEventListener('click', function(){
  const btn=this, url=location.href;
  const done=function(){ btn.textContent='Copied'; setTimeout(function(){ btn.textContent='Copy link'; },1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ window.prompt('Copy this link:',url); }); }
  else{ window.prompt('Copy this link:',url); }
});

// The view switch carries the selection: the current #node= rides along to the other view.
document.querySelector('.view-switch').addEventListener('click', e=>{
  const a=e.target.closest('a'), m=location.hash.match(/[#?&]node=([^&]*)/);
  if(a&&m) a.hash='node='+m[1];
});

// ---- pick-two path mode ----
let pathMode=null; // {a}
function startPath(a){ pathMode={a}; showRest(false); const pb=document.getElementById('pathbar'); pb.style.display='flex'; pb.innerHTML='<span>Path from <span class="ep">'+symHtml[a]+'</span>: shift-click a second quantity.</span>'+clearBtn('Cancel'); }
function finishPath(a,b){
  syncHash('#from='+encodeURIComponent(a)+'&to='+encodeURIComponent(b));
  const path=pathBetween(a,b);
  showRest(false);
  clearClasses();
  if(!path||!path.length){ const pb=document.getElementById('pathbar'); pb.style.display='flex'; pb.innerHTML='<span>No directed path between <span class="ep">'+symHtml[a]+'</span> and <span class="ep">'+symHtml[b]+'</span>.</span>'+clearBtn('Clear'); pathMode=null; return; }
  const keep=new Set(path); dimAllExcept(keep);
  path.forEach((n,i)=>{ const el=vp.querySelector('.node[data-id="'+cssesc(n)+'"]'); if(el) el.classList.add(i===0?'up':(i===path.length-1?'sel':'down')); });
  for(let i=0;i<path.length-1;i++){ if(opByEdge[path[i]+'>>'+path[i+1]]!==undefined) paintEdge(path[i],path[i+1],'down'); else paintEdge(path[i+1],path[i],'up'); }
  // panel: the linear chain
  let h=closeBtn()+'<div class="lab"><span class="dot d"></span>Derivation path</div>';
  h+='<div class="summary">'+(path.length-1)+(path.length===2?' step':' steps')+' from '+tex(nodeById[a].symbol)+' to '+tex(nodeById[b].symbol)+'.</div>';
  for(let i=0;i<path.length-1;i++){ const fwd=opByEdge[path[i]+'>>'+path[i+1]]!==undefined; h+= fwd? stepHtml(path[i],path[i+1],i+1,'down') : stepHtml(path[i+1],path[i],i+1,'up'); }
  const p=document.getElementById('panel'); p.innerHTML=h; p.style.display='block';
  const pb=document.getElementById('pathbar'); pb.style.display='flex'; pb.innerHTML='<span class="ep">'+symHtml[a]+'</span><span class="arrow">&rarr;</span><span class="ep">'+symHtml[b]+'</span>'+clearBtn('Clear');
  fitTo(path, b); pathMode=null;
}

function resetAll(){ syncHash(null); clearClasses(); document.getElementById('panel').style.display='none'; document.getElementById('pathbar').style.display='none'; showRest(true); pathMode=null; }

// ---- pan / zoom / click ----
let dragging=false, moved=false, sx=0, sy=0, vbs=null;
svg.addEventListener('mousedown', e=>{ dragging=true; moved=false; sx=e.clientX; sy=e.clientY; vbs={x:VB.x,y:VB.y}; svg.classList.add('drag'); });
window.addEventListener('mouseup', ()=>{ dragging=false; svg.classList.remove('drag'); });
window.addEventListener('mousemove', e=>{ if(!dragging)return; const m=svg.getScreenCTM(); if(!m)return; const dx=(e.clientX-sx)/m.a, dy=(e.clientY-sy)/m.d; if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4) moved=true; VB.x=vbs.x-dx; VB.y=vbs.y-dy; setVB(); });
svg.addEventListener('wheel', e=>{ e.preventDefault(); const m=svg.getScreenCTM(); if(!m)return; const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const u=pt.matrixTransform(m.inverse()); const f=capOut(e.deltaY>0?1.12:0.893, VB); VB.x=u.x-(u.x-VB.x)*f; VB.y=u.y-(u.y-VB.y)*f; VB.w*=f; VB.h*=f; setVB(); }, {passive:false});

// ---- touch: single-finger pan, two-finger pinch, tap = trace ---------------
// Independent of the mouse path (desktop unchanged). A client point maps to
// SVG-user space by inverting the preserveAspectRatio="xMidYMid meet" fit (the
// same math syncLabels uses), so every viewport change routes through VB+setVB
// and the HTML label overlay stays in sync. A tap under a small movement
// threshold traces the touched node (touch has no shift for the path mode).
function clientToUser(cx,cy){
  const r=svg.getBoundingClientRect();
  const sc=Math.min(r.width/VB.w, r.height/VB.h) || 1;
  const ox=(r.width-VB.w*sc)/2, oy=(r.height-VB.h*sc)/2;
  return { x:(cx-r.left-ox)/sc + VB.x, y:(cy-r.top-oy)/sc + VB.y };
}
let tPan=null, tPinch=null, tMoved=false, tStart=null;
function touchMid(t){ return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 }; }
function touchDist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.hypot(dx,dy); }
svg.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    tPinch=null; tMoved=false;
    const t=e.touches[0]; tStart={x:t.clientX,y:t.clientY,target:e.target};
    tPan={x:t.clientX,y:t.clientY,vbx:VB.x,vby:VB.y};
  } else if(e.touches.length===2){
    e.preventDefault(); tPan=null; tMoved=true;
    tPinch={dist:touchDist(e.touches)||1,vb:{x:VB.x,y:VB.y,w:VB.w,h:VB.h}};
  }
}, {passive:false});
svg.addEventListener('touchmove', e=>{
  if(tPinch && e.touches.length>=2){
    e.preventDefault();
    const mid=touchMid(e.touches);
    VB=tPinch.vb;
    const u=clientToUser(mid.x,mid.y);
    const f=capOut(tPinch.dist/(touchDist(e.touches)||1), tPinch.vb);
    VB={ x:u.x-(u.x-tPinch.vb.x)*f, y:u.y-(u.y-tPinch.vb.y)*f, w:tPinch.vb.w*f, h:tPinch.vb.h*f };
    setVB();
  } else if(tPan && e.touches.length===1){
    const t=e.touches[0];
    if(Math.abs(t.clientX-tPan.x)+Math.abs(t.clientY-tPan.y)>6) tMoved=true;
    if(!tMoved) return;
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    const sc=Math.min(r.width/VB.w, r.height/VB.h) || 1;
    VB.x=tPan.vbx-(t.clientX-tPan.x)/sc; VB.y=tPan.vby-(t.clientY-tPan.y)/sc; setVB();
  }
}, {passive:false});
svg.addEventListener('touchend', e=>{
  if(e.touches.length===0){
    if(tPan && !tMoved && tStart){
      const nd=tStart.target.closest && tStart.target.closest('.node');
      if(nd){ trace(nd.dataset.id); } else { resetAll(); }
    }
    tPan=null; tPinch=null; tStart=null;
  }
}, {passive:false});
svg.addEventListener('click', e=>{ if(moved)return; const nd=e.target.closest('.node'); if(!nd){ resetAll(); return; } const id=nd.dataset.id;
  if(e.shiftKey){ if(pathMode&&pathMode.a&&pathMode.a!==id){ finishPath(pathMode.a,id); } else { startPath(id); } return; }
  trace(id);
});
// keyboard: Enter or Space traces the focused quantity, Shift+Enter picks it
// for a path, Escape resets
svg.addEventListener('keydown', e=>{
  const nd=(e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.node'); if(!nd) return;
  e.preventDefault(); const id=nd.dataset.id;
  if(e.shiftKey&&e.key==='Enter'){ if(pathMode&&pathMode.a&&pathMode.a!==id) finishPath(pathMode.a,id); else startPath(id); return; }
  trace(id);
});
window.addEventListener('keydown', e=>{ if(e.key==='Escape') resetAll(); });
window.navTo=function(id){ if(nodeById[id]) trace(id); };
const qInput=document.getElementById('q');
qInput.addEventListener('input', function(){
  const v=this.value.trim().toLowerCase(); if(!v){ lastHits=[]; resetAll(); return; }
  const hits=Object.values(nodeById).filter(n=> (n.id+' '+n.symbol).toLowerCase().includes(v)).map(n=>n.id);
  lastHits=hits;
  if(hits.length===1){ trace(hits[0]); return; }
  const set=new Set(hits); showRest(false); clearClasses();
  dimAllExcept(set); hits.forEach(h=> vp.querySelector('.node[data-id="'+cssesc(h)+'"]')?.classList.add('sel'));
  document.getElementById('panel').style.display='none';
  if(hits.length) fitTo(hits, hits[0]);
});
// Enter traces the first hit
qInput.addEventListener('keydown', e=>{ if(e.key==='Enter'&&lastHits.length){ e.preventDefault(); trace(lastHits[0]); } });
</script>
