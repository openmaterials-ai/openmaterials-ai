<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | OpenMaterials</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- GitHub Pages serves this file for every unknown path. Until the site Worker is routed on the
     domain, the short links the site hands out are forwarded here, before paint, to the pages that
     already resolve them: /l/<id> and /l/<scheme:ref>/<id> to the datasheet, /s/<code> to the
     playground's stored set. -->
<script>(function(){try{var p=location.pathname,m,t;
if(m=p.match(/^\/l\/([0-9a-f]{8,64})\/?$/i))t='/play/#id='+m[1].toLowerCase();
else if(m=p.match(/^\/l\/[a-z][a-z0-9+.-]*:[^/]+\/([0-9a-f]{8,64})\/?$/i))t='/play/#id='+m[1].toLowerCase();
else if(m=p.match(/^\/s\/([1-9A-HJ-NP-Za-km-z]{9})\/?$/))t='/play/#s='+m[1];
if(t){document.documentElement.dataset.forward='play';location.replace(t);}}catch(e){}})();</script>
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
<link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-site-header></div>

<main class="frame" id="main">
  <section class="nf-body">
    <p class="eyebrow">404</p>
    <h1>There is no page at this address.</h1>
    <p class="lede">Check the address for a typo, or open one of the main pages below.</p>
    <div class="cta-row">
      <a class="btn btn--primary" href="/map/">Open the map</a>
      <a class="btn btn--secondary" href="/">Go to the home page</a>
    </div>
    <p class="small"><a href="/play/">Playground</a> · <a href="/guide/">Guide</a> · <a href="/codes/">Codes</a></p>
  </section>
  <section class="nf-forward">
    <p class="lede" data-for="play">Opening this link in the playground.</p>
  </section>
</main>

<div data-site-footer></div>
<script src="/assets/site.js"></script>
</body>
</html>
